obligations:
- id: OBL-510K-001
  title: Substantial Equivalence Argument
  source: FDA 510(k) SE Guidance (2014) §III Substantial Equivalence Standard
  section: Substantial Equivalence Standard — Decision Points 1–5
  scope_flags:
  - 510k
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - 510(k) Submission — SE Argument
  - Predicate Device Analysis
  verbatim: A device is substantially equivalent if it has the same intended use as
    the predicate device AND either the same technological characteristics, or different
    technological characteristics that do not raise different questions of safety
    and effectiveness and the device is shown to be as safe and effective as a legally
    marketed device.
  extracted_requirements:
  - Demonstrate same intended use as the predicate device — intended use is the general
    purpose/function, encompassing indications for use
  - If same technological characteristics: document that characteristics match
  - If different technological characteristics: demonstrate they do NOT raise different
      safety/effectiveness questions AND the device is as safe and effective as a
      legally marketed device
  - Use a comparison table (new device vs. predicate) to document technological characteristics
    — FDA strongly recommends tabular format
  - An NSE determination classifies the device into Class III (requiring PMA or De
    Novo)
  category: fda-guidance
- id: OBL-510K-002
  title: Predicate Device Selection
  source: FDA 510(k) SE Guidance (2014) §IV Predicate Device Selection
  section: Predicate Device Selection Principles
  scope_flags:
  - 510k
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Predicate Device Analysis
  - 510(k) Submission — Device Description
  verbatim: Only one predicate is required; FDA encourages identifying a single predicate
    to simplify review. A split predicate (comparing intended use to Device A while
    comparing technological characteristics to Device B with a different intended
    use) is prohibited. Multiple predicates are permitted when combining features
    from predicates with the same intended use.
  extracted_requirements:
  - Select a primary predicate with intended use and technological characteristics
    most similar to MedTech Project
  - Do NOT use a split predicate: cannot compare intended use to one device and technological
      characteristics to another device with a different intended use
  - Multiple predicates permitted if all have the same intended use — combining features
    from each
  - Predicate must be legally marketed: cleared via 510(k), pre-May 28, 1976, or reclassified
      from Class III
  - For PCCP predicate comparison: if predicate had an authorized PCCP, compare to
      the version BEFORE PCCP-implemented changes
  - Document predicate search rationale: how the predicate was identified and why
      it is the most similar legally marketed device
  category: fda-guidance
- id: OBL-510K-003
  title: Performance Data for SE
  source: FDA 510(k) SE Guidance (2014) §V Performance Data
  section: Performance Data Hierarchy — Least Burdensome
  scope_flags:
  - 510k
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - 510(k) Submission — Performance Testing
  - V&V Plan
  verbatim: 'FDA follows a stepwise approach: (1) descriptive information about technological
    characteristics; (2) non-clinical bench performance testing/analytical studies;
    (3) non-clinical animal and/or biocompatibility studies; (4) clinical performance
    data. Clinical data may be requested when: new/modified indications need verification;
    technological differences are significant; non-clinical testing methods are limited
    or inappropriate.'
  extracted_requirements:
  - Apply the least-burdensome principle: provide the minimum data necessary to demonstrate
      SE
  - Non-clinical performance testing (algorithm performance on representative datasets)
    is the primary data type for SaMD 510(k)s
  - Clinical data may be requested if AI performance differences are significant enough
    that non-clinical testing cannot demonstrate equivalence
  - For AI-DSF: performance testing data typically serves as bench performance testing
      (step 2)
  - Document the rationale for the chosen performance data type and why it is sufficient
  category: fda-guidance
- id: OBL-510K-004
  title: 510(k) Summary Content
  source: FDA 510(k) SE Guidance (2014) §VI 510(k) Summary
  section: The 510(k) Summary
  scope_flags:
  - 510k
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - 510(k) Submission — 510(k) Summary
  - SE Narrative
  verbatim: Required per 21 CFR 807.92. Must be in sufficient detail to explain the
    basis for SE determination. FDA encourages 510(k) Summary (rather than 510(k)
    Statement) for transparency.
  extracted_requirements:
  - Include a 510(k) Summary per 21 CFR 807.92 — required, not optional
  - Summary must contain sufficient detail to explain the SE determination basis
  - Summary must be publicly available — it becomes the public record of the clearance
  - FDA prefers the 510(k) Summary over the 510(k) Statement for transparency
  - For PCCP devices: public summary should include planned PCCP modifications, testing
      methods, and user communication plan
  category: fda-guidance
- id: OBL-AI-LIFE-001
  title: AI Device Description
  source: FDA AI Lifecycle Guidance (2025) §V Device Description
  section: AI Device Description — Required Content
  scope_flags:
  - ai
  - 510k
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - 510(k) Submission — Device Description
  - Software Description
  verbatim: Statement that AI is used. Inputs, outputs, intended users, use environment,
    workflow integration. Automation level and configurable elements. Hardware platform
    description.
  extracted_requirements:
  - 510(k) device description must explicitly state that the device includes AI
  - Describe AI inputs (imaging data type, format, resolution requirements), outputs
    (segmentation, measurements, guidance recommendations), intended users, and use
    environment
  - State the automation level: fully automated, human-in-the-loop, human-on-the-loop,
      or human-supervised
  - Describe hardware platform on which AI runs (server for Pre-Op, tablet for Intra-Op)
  - Describe workflow integration: where in the clinical workflow the AI output is
      presented to the clinician
  category: fda-guidance
- id: OBL-AI-LIFE-002
  title: AI Device Labeling
  source: FDA AI Lifecycle Guidance (2025) §VI Labeling
  section: AI Labeling Requirements
  scope_flags:
  - ai
  - 510k
  topic: labeling-ifu
  artifact_type: labeling
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Instructions for Use
  - User Documentation
  - 510(k) Submission — Labeling
  verbatim: 'Labeling must include: AI inclusion statement, model I/O, automation
    level, architecture description, development data description, performance data
    with confidence intervals, subgroup performance, performance monitoring tools,
    known limitations, installation/integration instructions.'
  extracted_requirements:
  - IFU must state that AI is included and describe its role in the device
  - IFU must disclose model inputs and outputs in plain language understandable to
    the intended user (surgeon)
  - IFU must state the automation level and explicitly note that the surgeon maintains
    clinical authority
  - Disclose development data characteristics: training data size, source population
      demographics, geographic distribution, imaging equipment used
  - Include performance data with 95% confidence intervals for all primary performance
    metrics
  - Include subgroup performance breakdown: sex, age, race/ethnicity, disease severity,
      BMI (as applicable)
  - Document known limitations: imaging conditions where performance may degrade,
      patient populations not well-represented in training data
  - Performance monitoring tools disclosure: how users can track device performance
      in their clinical setting
  category: fda-guidance
- id: OBL-AI-LIFE-003
  title: AI Data Management Plan
  source: FDA AI Lifecycle Guidance (2025) §VIII Data Management
  section: Data Management — Development and Testing Data
  scope_flags:
  - ai
  - 510k
  topic: validation
  artifact_type: submission-content
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - 510(k) Submission — Performance Testing
  - Data Management Plan
  verbatim: Data collection protocols, cleaning/processing, reference standard, annotation.
    Data storage/version control. Development/test data independence. Representativeness
    analysis (demographics, sites, equipment). Subgroup analysis. OUS data justification
    (if applicable). Synthetic data justification (if applicable).
  extracted_requirements:
  - Document data collection protocols for training and testing datasets: inclusion/exclusion
      criteria, demographics, imaging equipment, sites
  - Demonstrate representativeness: development and test data must represent the intended
      use population (demographics, clinical settings, imaging equipment types)
  - Perform subgroup analysis: assess AI performance separately for key subpopulations
      (sex, age, race/ethnicity, BMI, disease severity)
  - If using out-of-US (OUS) data for training/testing: justify applicability to US
      intended use population
  - If using synthetic data: justify the methodology and demonstrate that synthetic
      data appropriately represents real clinical data
  - Test data must be independent of development data — provide evidence of sequestration
  category: fda-guidance
- id: OBL-AI-LIFE-004
  title: AI Performance Validation
  source: FDA AI Lifecycle Guidance (2025) §X Performance Validation
  section: AI Performance Validation — Statistical Requirements
  scope_flags:
  - ai
  - 510k
  topic: validation
  artifact_type: submission-content
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - 510(k) Submission — Performance Testing
  - Clinical/Non-Clinical Study Protocol
  verbatim: Pre-specified study protocols and statistical analysis plans. Sample size
    justification with adequate power. Primary/secondary endpoints with pre-specified
    acceptance criteria. Statistical hypotheses (null and alternative) with multiplicity
    corrections. Subgroup analyses (statistically powered when subgroup claims are
    made). Repeatability/reproducibility evaluation. Human-device team performance
    (when human is in the loop). 95% two-sided confidence intervals standard for primary
    endpoints.
  extracted_requirements:
  - Pre-specify all study protocols and statistical analysis plans BEFORE conducting
    performance validation — post-hoc modifications require FDA concurrence
  - Provide sample size justification with statistical power analysis for primary
    endpoints
  - Define primary/secondary endpoints with pre-specified acceptance criteria (pass/fail
    thresholds)
  - State null and alternative hypotheses; apply multiplicity corrections for multiple
    endpoints
  - Conduct statistically powered subgroup analyses for key demographic subgroups
    when making subgroup performance claims
  - Evaluate repeatability (same reader, same image, different times) and reproducibility
    (different readers, different sites)
  - For human-in-the-loop AI (MedTech Project): evaluate human-device team performance
      — how does the surgeon perform WITH the AI vs. without?
  - Report all primary endpoints with 95% two-sided confidence intervals
  category: fda-guidance
- id: OBL-AI-LIFE-005
  title: AI Performance Monitoring
  source: FDA AI Lifecycle Guidance (2025) §XI Device Performance Monitoring
  section: Post-Market AI Performance Monitoring
  scope_flags:
  - ai
  - 510k
  - pccp
  topic: post-market
  artifact_type: plan
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Post-Market Surveillance Plan
  - Device Performance Monitoring Plan
  verbatim: Data collection methods for postmarket monitoring. Drift detection (data
    drift, concept drift). Input monitoring. User behavior monitoring. Update deployment
    plan. Communication procedures for performance changes.
  extracted_requirements:
  - Define a post-market AI performance monitoring plan as part of the submission
  - Specify data drift detection: monitoring whether real-world input data distribution
      shifts from training distribution (imaging equipment changes, patient population
      changes)
  - Specify concept drift detection: monitoring whether the AI's performance on its
      intended task degrades over time
  - Define monitoring metrics, monitoring frequency, and thresholds that trigger investigation/corrective
    action
  - Define how performance changes are communicated to users (update release notes,
    labeling updates)
  - For PCCP devices: the performance monitoring plan must integrate with the PCCP
      device monitoring plan
  category: fda-guidance
- id: OBL-AI-LIFE-006
  title: AI-Specific Cybersecurity
  source: FDA AI Lifecycle Guidance (2025) §XII Cybersecurity (AI-Specific)
  section: AI-Specific Cybersecurity Threats
  scope_flags:
  - ai
  - cybersecurity
  - 510k
  topic: cybersecurity
  artifact_type: submission-content
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Threat Model
  - Security Risk Assessment
  - 510(k) Submission — Cybersecurity
  verbatim: 'AI-specific threat model: data poisoning, model inversion, evasion attacks,
    data leakage, overfitting exploitation, bias manipulation, performance drift.
    Fuzz testing, penetration testing. Access controls, encryption, de-identification.'
  extracted_requirements:
  - Threat model must include AI-specific attacks in addition to standard cybersecurity
    threats
  - Data poisoning: adversary corrupts training/re-training data to degrade model
      performance or introduce bias
  - Model inversion: adversary attempts to reconstruct patient data from AI model
      outputs
  - Evasion attacks: adversary manipulates inputs (e.g., imaging data) to cause AI
      to produce incorrect outputs
  - Bias manipulation: adversary systematically degrades AI performance for specific
      patient subpopulations
  - Performance drift exploitation: adversary exploits known model weaknesses during
      periods of degraded performance
  - AI model access controls: who can trigger re-training, update deployment, and
      model configuration changes
  category: fda-guidance
- id: OBL-AIML-PCCP-001
  title: AI Modification Description
  source: FDA AI/ML PCCP Guidance (2025) §VI Description of Modifications
  section: Description of Modifications — AI-Specific Content
  scope_flags:
  - pccp
  - 510k
  - ai
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - PCCP Document — Description of Modifications section
  verbatim: 'Statement whether modifications are implemented automatically, manually,
    or combination. Statement whether modifications are global (uniform across all
    devices) or local (site/patient-specific). For local adaptations: description
    of what local factors warrant the change. Expected frequency of updates. Modifications
    must maintain the device within its intended use and indications for use.'
  extracted_requirements:
  - For each AI-DSF modification: state whether implementation is automatic, manual,
      or combined
  - State whether the modification is global (same for all deployed devices) or local
    (site/patient-specific adaptation)
  - For local adaptations: document which local factors (patient demographics, local
      image acquisition conditions, site workflow) trigger the modification
  - State expected frequency of updates (e.g., quarterly re-training, continuous learning
    with annual release)
  - All modifications must keep the device within its authorized intended use and
    indications for use
  category: fda-guidance
- id: OBL-AIML-PCCP-002
  title: AI Data Management Protocol
  source: FDA AI/ML PCCP Guidance (2025) §VII Data Management Practices
  section: Modification Protocol — Data Management
  scope_flags:
  - pccp
  - 510k
  - ai
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - PCCP Document — Modification Protocol
  - Data Management Plan
  verbatim: Collection protocols (inclusion/exclusion criteria, intended data distribution
    across covariates including sex, age, race, disease conditions, acquisition conditions,
    prospective vs. retrospective, enrichment/stratified sampling, number and geographic
    distribution of sites). Data quality assurance (consistency, completeness, authenticity,
    missing data handling, traceability). Test data sequestration (strategies to shield
    test data from development).
  extracted_requirements:
  - Define data collection protocols for PCCP re-training: inclusion/exclusion criteria,
      covariate distribution requirements (sex, age, race, disease conditions, imaging
      acquisition conditions)
  - Specify number and geographic distribution of sites contributing to re-training
    datasets
  - Define data quality assurance procedures: consistency checks, completeness, authenticity
      verification, handling of missing/equivocal data
  - Define reference standard determination method and clinician grading protocol
  - Define test data sequestration procedures — training data and test data must be
    strictly separated; test data never seen during development
  - Document measures to prevent unwanted bias from repeated use of test data sets
  category: fda-guidance
- id: OBL-AIML-PCCP-003
  title: AI Performance Evaluation Protocol
  source: FDA AI/ML PCCP Guidance (2025) §VII Performance Evaluation
  section: Modification Protocol — Performance Evaluation
  scope_flags:
  - pccp
  - 510k
  - ai
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - PCCP Document — Modification Protocol
  - V&V Protocol Templates
  verbatim: 'Assessment metrics (specific metrics, how they demonstrate safe use,
    comprehensive performance assessment, challenging cases). Statistical analysis
    plans (equivalent/improved performance vs. previous versions, high-risk subpopulations,
    sensitivity/specificity trade-offs, sample size determination). Performance targets
    (acceptance criteria, comparison to authorized version criteria, clinical justification).
    Failure handling: unresolvable failures must be recorded and specific modifications
    must NOT be implemented.'
  extracted_requirements:
  - Pre-specify performance metrics for each modification: sensitivity, specificity,
      AUC, measurement accuracy, etc.
  - Include statistical analysis plans: null/alternative hypotheses, sample size justification,
      primary analysis population, subgroup analysis requirements
  - Define acceptance criteria comparing modified AI-DSF to both the original authorized
    version AND the immediately preceding version
  - Perform performance evaluation across high-risk subpopulations (sex, age, race,
    disease severity, imaging acquisition variations)
  - If acceptance criteria are not met (unresolvable failure), the modification MUST
    NOT be implemented — document this requirement explicitly
  - Root cause analysis allowed for resolvable failures (not due to PCCP-specific
    aspects)
  category: fda-guidance
- id: OBL-AIML-PCCP-004
  title: AI Update Procedures
  source: FDA AI/ML PCCP Guidance (2025) §VII Update Procedures
  section: Modification Protocol — Update Procedures
  scope_flags:
  - pccp
  - 510k
  - ai
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - PCCP Document — Modification Protocol
  - Post-Market Surveillance Plan
  - Labeling Update Process
  verbatim: Software V&V (whether plan differs from original, integrated environment
    testing, impact on other device functions). When and how updates deploy (decision
    criteria, expected timeline, frequency, mechanism, verification of critical safety
    features post-update). Communication and transparency (PCCP description in public
    summary/labeling, update communication to users, version information, option to
    review labeling before update). Device monitoring plan (adverse event tracking,
    real-world performance monitoring, subpopulation performance changes, rollback
    criteria).
  extracted_requirements:
  - Define software V&V procedures for each update: integration testing, regression
      testing, impact on non-modified device functions
  - Define update deployment mechanism: OTA update process, deployment timeline after
      V&V approval, staged rollout vs. simultaneous global deployment
  - Define post-update verification of critical safety features before the device
    is used in surgery
  - Define the real-world device monitoring plan: metrics collected, monitoring frequency,
      performance drift detection thresholds, subpopulation monitoring
  - Define rollback criteria and rollback procedure if post-deployment performance
    degrades
  - Communication plan: how users are informed of modifications, version information
      availability, labeling update process
  category: fda-guidance
- id: OBL-AIML-PCCP-005
  title: AI Change Impact Assessment
  source: FDA AI/ML PCCP Guidance (2025) §VIII Impact Assessment
  section: Impact Assessment — AI-Specific Content
  scope_flags:
  - pccp
  - 510k
  - ai
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - PCCP Document — Impact Assessment
  - Risk Management File
  verbatim: Discussion of benefits and risks of each modification, including risks
    of harm and unintended bias. How V&V activities in the Modification Protocol ensure
    continued safety and effectiveness. How implementation of one modification impacts
    another. Cumulative impact of implementing all modifications.
  extracted_requirements:
  - For each AI-DSF modification: assess risks of harm AND risks of unintended bias
      (demographic bias, site-specific bias, data drift bias)
  - Discuss how the Modification Protocol V&V activities specifically address each
    identified risk
  - Assess modification interaction effects: does implementing Pre-Op algorithm update
      affect Intra-Op guidance performance?
  - Assess cumulative impact when all PCCP modifications are implemented simultaneously
  - Cross-reference bias risk management with the data management practices (how training
    data distribution controls bias risks)
  category: fda-guidance
- id: OBL-AIML-PCCP-006
  title: AI Change Quality System
  source: FDA AI/ML PCCP Guidance (2025) §IX Quality System
  section: Quality System Requirements
  scope_flags:
  - pccp
  - 510k
  - ai
  topic: configuration-change
  artifact_type: process-record
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Design Change Records
  - PCCP Implementation Records
  - CAPA Records
  verbatim: QMS compliance with 21 CFR Part 820 / ISO 13485:2016. Design control procedures
    for PCCP modifications (21 CFR 820.30). Change management processes for PCCP implementation.
    Document and record retention (minimum 2 years from commercial release). CAPA
    procedures applicable to PCCP deviations.
  extracted_requirements:
  - Each PCCP modification implementation is a design change under ISO 13485 §7.3.9
    — must be reviewed, V&V'd per the Modification Protocol, and approved before release
  - Maintain QMS records for each PCCP modification: V&V results, comparison to acceptance
      criteria, approval authorization, deployment record
  - Document and record retention: minimum 2 years from commercial release for each
      modification record
  - PCCP deviations (failure to follow the Modification Protocol) must be handled
    via CAPA
  - QSR transition to ISO 13485 effective February 2, 2026 — QMS must be compliant
    before first post-market PCCP modification
  category: fda-guidance
- id: OBL-CDS-001
  title: CDS Criterion 1 Analysis
  source: FDA CDS Guidance (2026) §IV Criterion 1
  section: Criterion 1 — Does NOT Acquire, Process, or Analyze Certain Data Types
  scope_flags:
  - common-baseline
  - 510k
  topic: regulatory-submission
  artifact_type: analysis
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Device Classification Determination
  - 510(k) Submission — Device Description
  - CDS Exemption Analysis
  verbatim: 'The software function must not acquire, process, or analyze: medical
    images, signals from an IVD, or patterns or signals from a signal acquisition
    system. Any software that directly analyzes X-rays, CT scans, MRI, ultrasound,
    or similar data is a device regardless of whether it meets criteria 2-4.'
  extracted_requirements:
  - Any software function that acquires, processes, or analyzes medical images FAILS
    criterion 1 and is a device (SaMD) — cannot claim CDS non-device status
  - MFD A FAILS criterion 1: it processes CT/MRI images for anatomy segmentation and
      implant sizing → is a SaMD device
  - MFD B FAILS criterion 1: it acquires and processes C-arm fluoroscopy images for
      surgical guidance → is a SaMD device
  - Software analyzing HCP-reported findings (not images themselves) may qualify as
    non-device CDS if other criteria are met
  - Management Services PostOp Reports must be analyzed: if it analyzes imaging data
      → is a device; if it only displays clinical summaries from HCP-reported findings
      → may be non-device
  category: fda-guidance
- id: OBL-CDS-002
  title: CDS Criteria 3–4 Analysis
  source: FDA CDS Guidance (2026) §IV Criteria 3 and 4
  section: Criterion 3 — Supports HCP Recommendations; Criterion 4 — Enables Independent
    Review
  scope_flags:
  - common-baseline
  - 510k
  topic: regulatory-submission
  artifact_type: analysis
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Device Classification Determination
  - 510(k) Submission — Indications for Use
  - Labeling
  verbatim: 'Criterion 3: Does not provide a specific preventive, diagnostic, or treatment
    output or directive; is not intended to replace the HCP''s judgment. Criterion
    4: The software enables an HCP to independently review the basis for recommendations
    so the HCP does not rely primarily on such recommendations. Higher automation
    increases risk of automation bias; time-critical nature moves from criterion 3
    to criterion 4.'
  extracted_requirements:
  - For Management Services PostOp Reports: evaluate against all four CDS criteria
      to confirm non-device status
  - Criterion 4 requires the HCP to be able to independently verify any recommendation
    — software must provide sufficient supporting information
  - Time-critical outputs (e.g., intraoperative alerts for life-threatening conditions)
    fail criterion 4 — HCP cannot adequately review basis in real-time
  - High automation level risks automation bias — criterion 4 consideration
  - Enforcement discretion applies when only ONE clinically appropriate recommendation
    exists (cannot fail criterion 3 in that case)
  category: fda-guidance
- id: OBL-CDS-003
  title: CDS Device Determination
  source: FDA CDS Guidance (2026) §V Device Determination Process
  section: 513(g) Request and Q-Sub for CDS Classification Questions
  scope_flags:
  - common-baseline
  - 510k
  topic: regulatory-submission
  artifact_type: process-record
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Q-Sub Package
  - Device Classification Documentation
  verbatim: For software where CDS status is uncertain, FDA recommends submitting
    a 513(g) request for device determination, or using a Q-Submission to discuss
    with FDA.
  extracted_requirements:
  - For any software function where CDS non-device status is uncertain: use a Q-Sub
      (pre-submission meeting) to get FDA feedback before filing the 510(k)
  - Document the CDS analysis (four-criterion evaluation) for each software function
    in the 510(k) submission
  - Management Services PostOp Reports: if there is any uncertainty about non-device
      status, raise it as a Q-Sub question before submission
  - The CDS classification determination is a required part of the 510(k) device description
    section
  category: fda-guidance
- id: OBL-CYBER-001
  title: §524B Statutory Requirements
  source: FDA Cybersecurity Guidance (2023) §524B Statutory Requirements
  section: Section 524B — Statutory Requirements for Cyber Devices
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: cybersecurity
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - 510(k) Submission — Cybersecurity Documentation
  - Post-Market Cyber Plan
  - SBOM
  verbatim: 'Sponsors must provide: (1) post-market cybersecurity plan to monitor,
    identify, and address post-market vulnerabilities and exploits, including coordinated
    vulnerability disclosure; (2) process documentation for design, development, and
    maintenance providing reasonable assurance the device is cybersecure; (3) update/patch
    capability for post-market updates and patches for known unacceptable vulnerabilities;
    (4) Software Bill of Materials (SBOM) including commercial, open-source, and off-the-shelf
    software components.'
  extracted_requirements:
  - SBOM is a STATUTORY requirement for cyber device premarket submissions (FD&C Act
    §524B) — not optional
  - Post-market cybersecurity plan is STATUTORY — must describe how manufacturer monitors,
    identifies, and addresses vulnerabilities
  - Process documentation demonstrating cybersecure design, development, and maintenance
    must be included in the submission
  - Update and patch capability must be built into the device — mechanism for both
    regular-cycle and out-of-cycle critical vulnerability patches
  - MedTech Project qualifies as a "cyber device" (includes software, internet-connected,
    vulnerable to cyber threats) — all §524B requirements apply
  category: fda-guidance
- id: OBL-CYBER-002
  title: Security Risk Management
  source: FDA Cybersecurity Guidance (2023) §III Security Risk Management
  section: Security Risk Management — Documentation
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: cybersecurity
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Security Risk Management Report
  - Threat Model
  - 510(k) Submission
  verbatim: Security Risk Management Report (e.g., per AAMI TIR57). Threat Modeling
    Documentation — full system and lifecycle scope. Cybersecurity Risk Assessment
    — use exploitability (not probability) to assess risks. Third-Party Software Component
    Assessment — SBOM, support/end-of-support info, vulnerability assessment.
  extracted_requirements:
  - Include a Security Risk Management Report in the premarket submission (per AAMI
    TIR57 or equivalent)
  - Include Threat Modeling Documentation covering the full system and full lifecycle
    (not just the device in isolation)
  - Cybersecurity Risk Assessment must use exploitability (not probability) for likelihood
    assessment — human-actor threats cannot use traditional probabilistic methods
  - Third-party software component assessment: SBOM with support information, end-of-support
      dates, and vulnerability assessment per component
  - Security risk management is distinct from safety risk management (ISO 14971) but
    the two must feed each other
  category: fda-guidance
- id: OBL-CYBER-003
  title: SBOM Requirements
  source: FDA Cybersecurity Guidance (2023) §IV SBOM Requirements
  section: SBOM Requirements
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: cybersecurity
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - SBOM
  - 510(k) Submission — Cybersecurity Section
  verbatim: 'SBOM must be machine-readable. Consistent with NTIA minimum elements
    (October 2021, second edition). Must be complete — all transitive dependencies
    included. If transitive dependencies unknown, justify the gap. Accompanying information:
    software level of support, software component end-of-support date, safety and
    security risk assessment for each known vulnerability, details of applicable risk
    controls.'
  extracted_requirements:
  - SBOM must be machine-readable (SPDX or CycloneDX format)
  - SBOM must include all transitive dependencies — not just direct dependencies
  - SBOM fields (NTIA minimum): component name, version, supplier, dependency relationship,
      author, timestamp
  - For each SBOM component: document support level, end-of-support date, and vulnerability
      assessment
  - FDA does NOT accept a risk-based approach to selectively including components
    — all components must be listed
  - If transitive dependencies are unknown, this gap must be explicitly justified
    (not silently omitted)
  category: fda-guidance
- id: OBL-CYBER-004
  title: Security Architecture Documentation
  source: FDA Cybersecurity Guidance (2023) §V Security Architecture
  section: Security Architecture Views — Four Categories
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: architecture
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Security Architecture Document
  - 510(k) Submission — Cybersecurity Section
  - SAD
  verbatim: 'Four security architecture view categories: (1) global system view; (2)
    multi-patient harm view — how a cybersecurity event could affect multiple patients;
    (3) updateability and patchability view — how patches are delivered; (4) security
    use case views — all use cases for operational states and clinical scenarios.'
  extracted_requirements:
  - Include all four security architecture view categories in the premarket submission
  - Global system view: shows all system elements, interfaces, trust boundaries, security
      domains
  - Multi-patient harm view: analyzes how a single cybersecurity event (e.g., supply
      chain attack, ransomware) could affect multiple patients simultaneously
  - Updateability/patchability view: diagrams how software updates/patches are delivered,
      authenticated, and applied
  - Security use case views: covers all operational states (normal, degraded, update,
      maintenance) and clinical scenarios
  - Architecture views must establish traceability to security requirements
  category: fda-guidance
- id: OBL-CYBER-005
  title: Cybersecurity Testing
  source: FDA Cybersecurity Guidance (2023) §VI Cybersecurity Testing
  section: Cybersecurity Testing — Four Types
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: verification
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Security Test Report
  - 510(k) Submission — Cybersecurity Section
  verbatim: 'Four types recommended: (1) security requirement testing — verifying
    security requirements are met; (2) threat mitigation testing — verifying mitigations
    are effective; (3) vulnerability testing — identifying vulnerabilities; (4) penetration
    testing — attempting to exploit vulnerabilities. Testing should be system-level,
    including all system elements and the use environment.'
  extracted_requirements:
  - Conduct all four types of cybersecurity testing before submission
  - Security requirement testing: verify each security requirement in the SRS is implemented
  - Threat mitigation testing: verify each threat mitigation from the threat model
      is effective
  - Vulnerability testing: active vulnerability scanning (automated tools)
  - Penetration testing: attempt to exploit identified vulnerabilities; third-party
      testing may be appropriate
  - Testing must be system-level — covering all system elements and the use environment
    (not just isolated components)
  - All four testing types are expected in the 510(k) submission regardless of device
    age/prior submissions
  category: fda-guidance
- id: OBL-CYBER-006
  title: Cybersecurity Management Plan
  source: FDA Cybersecurity Guidance (2023) §VII Cybersecurity Management Plan
  section: Cybersecurity Management Plan
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: post-market
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Cybersecurity Management Plan
  - Post-Market Surveillance Plan
  - 510(k) Submission
  verbatim: 'Required for cyber device submissions. Should include: how the manufacturer
    will manage cybersecurity throughout the device lifecycle, response to vulnerabilities
    and incidents, coordinated vulnerability disclosure processes, periodic security
    testing, timeline to develop and release patches, patching capability (rate at
    which updates can be delivered).'
  extracted_requirements:
  - Cybersecurity Management Plan is REQUIRED for cyber device 510(k) submissions
    under §524B
  - Plan must describe: post-market vulnerability monitoring process, incident response
      procedure, coordinated vulnerability disclosure process
  - Plan must specify: patching timeline (regular cycle and critical/out-of-cycle),
      patching capability (how frequently updates can be deployed)
  - Plan must identify personnel responsible (organizational roles with accountability
    — not individual names)
  - Periodic security testing cadence must be defined
  - Cloud-hosted devices: describe the shared responsibility model (what MedTech Company
      manages vs. cloud provider)
  category: fda-guidance
- id: OBL-MFD-001
  title: MFD Core Policy
  source: FDA MFD Guidance (2020) §III Core Policy
  section: Core MFD Policy — Device Functions vs. Other Functions
  scope_flags:
  - multi-function
  - 510k
  topic: regulatory-submission
  artifact_type: analysis
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - 510(k) Submission — Device Description
  - MFD Impact Analysis
  verbatim: FDA shall not regulate non-device software functions as devices. However,
    FDA may assess the impact that non-device functions have on device functions when
    evaluating safety and effectiveness. Non-device and other functions are reviewed
    only when they could impact the device function-under-review.
  extracted_requirements:
  - MedTech Project is a multiple function device product: Pre-Op (SaMD) + Intra-Op
      (SaMD) are device functions; Management Services is the "other function"
  - Management Services non-device functions (PostOp Reports, User Management, Account
    Management) are NOT reviewed unless they could adversely impact Pre-Op or Intra-Op
  - Document in the 510(k): which functions are device functions under review and
      which are "other functions"
  - Conduct a two-step impact assessment: (A) does the other function have impact
      on the device function? (B) if yes, could the impact increase risk or degrade
      performance?
  category: fda-guidance
- id: OBL-MFD-002
  title: MFD Impact Assessment
  source: FDA MFD Guidance (2020) §IV Impact Assessment
  section: Two-Step Impact Assessment — Shared Resources
  scope_flags:
  - multi-function
  - 510k
  topic: architecture
  artifact_type: analysis
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - MFD Impact Analysis
  - System Hazard Analysis
  - Architecture Document
  verbatim: 'Consider whether the functions share: computational resources, data dependencies
    (input data from other function used in critical calculations), code necessary
    for proper execution, memory or storage, output screen or GUI, programming pointers.
    Does the other function provide input data for a critical calculation? Does the
    other function affect processing time when sharing a processor? Does the other
    function serve as or impact a risk control measure for the device function?'
  extracted_requirements:
  - Assess shared resources between Management Services and the SaMD modules: computational
      resources, data dependencies, code, memory/storage, GUI
  - Assess whether Management Services functions can provide input data to critical
    calculations in Pre-Op or Intra-Op
  - If Management Services hosts the Pre-Op web application: assess whether Management
      Services failure affects Pre-Op availability
  - Assess cybersecurity cross-function risks: assume "other functions" may be employed
      maliciously to adversely impact the device function
  - Document the impact assessment in the hazard analysis (ISO 14971) — cross-function
    impacts are device hazards
  category: fda-guidance
- id: OBL-MFD-003
  title: MFD Premarket Requirements
  source: FDA MFD Guidance (2020) §V Premarket Submission Requirements
  section: Architecture Separation Recommendation
  scope_flags:
  - multi-function
  - 510k
  - common-baseline
  topic: architecture
  artifact_type: design-document
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - System Architecture Document
  - 510(k) Submission — Architecture
  - Hazard Analysis
  verbatim: Architectural separation strongly recommended. Logical separation, architectural
    separation, code and data partitioning should be used to the extent possible.
    Higher separation leads to easier independent review of safety and effectiveness.
    When separation is not achievable, interconnections and interdependencies must
    be explained in the hazard analysis with appropriate risk controls.
  extracted_requirements:
  - The system SAD must document the architectural separation between device functions
    (Pre-Op, Intra-Op) and "other functions" (Management Services)
  - Demonstrate that Management Services cannot alter the clinical processing or outputs
    of Pre-Op or Intra-Op
  - Where interconnections exist (plan delivery, OTA updates), document them explicitly
    in the hazard analysis with risk controls
  - Submit the architecture/design documents showing how/if "other functions" interact
    with the device function
  - Higher architectural separation → simpler FDA review of the device functions in
    isolation
  category: fda-guidance
- id: OBL-MFD-004
  title: MFD Change Impact
  source: FDA MFD Guidance (2020) §VI Modifications to Other Functions
  section: Modifications to Other Functions — New Submission Assessment
  scope_flags:
  - multi-function
  - 510k
  - pccp
  topic: configuration-change
  artifact_type: process-record
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Design Change Records
  - PCCP Change Records
  - Change Impact Analysis
  verbatim: 'When an other function is modified: assess whether the modification could
    significantly impact safety or effectiveness of the device function. If adverse
    impact (or labeled positive impact): reference applicable guidance to determine
    if a new premarket submission is required. Document the impact assessment per
    the quality system.'
  extracted_requirements:
  - Every modification to Management Services must be assessed for adverse impact
    on Pre-Op and Intra-Op safety/effectiveness
  - If a Management Services change could adversely affect either SaMD module, evaluate
    whether a new 510(k) is required
  - Even if Management Services changes are non-device, they must go through a documented
    impact assessment (QMS design change process)
  - PCCP changes affecting Management Services: assess cross-function impact before
      implementing
  - Document all Management Services change impact assessments per the QMS
  category: fda-guidance
- id: OBL-PCCP-001
  title: PCCP Guiding Principles
  source: FDA PCCP General Guidance (2024) §III Guiding Principles
  section: Guiding Principles 1–5
  scope_flags:
  - pccp
  - 510k
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - PCCP Document
  - 510(k) Submission Cover Letter
  - Device Description
  verbatim: A PCCP is part of the device marketing authorization. The manufacturer
    is required to implement modifications consistent with the authorized PCCP. A
    PCCP must include specific modifications the manufacturer intends to make — not
    any/all possible modifications. PCCPs work alongside the existing Device Modifications
    guidances, which still apply for modifications not covered by or not consistent
    with the PCCP.
  extracted_requirements:
  - A PCCP must be filed as part of the 510(k) marketing submission — it is NOT a
    separate post-market document
  - PCCP must specify only a few, specific verifiable/validatable modifications —
    overly broad modifications prevent FDA review
  - The authorized PCCP is binding — device considered adulterated/misbranded if PCCP
    is not followed
  - Modifications outside the PCCP scope must be evaluated under standard Device Modifications
    guidances
  - PCCP referenced in the letter of authorization (title and version number)
  category: fda-guidance
- id: OBL-PCCP-002
  title: PCCP Description of Modifications
  source: FDA PCCP General Guidance (2024) §IV Three-Component Structure
  section: Description of Modifications
  scope_flags:
  - pccp
  - 510k
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - PCCP Document — Description of Modifications section
  verbatim: Enumerate each individual proposed modification. Provide specific rationale
    for each change. Reference labeling sections anticipated to be impacted. Present
    at detail level permitting understanding of specific modifications. Link each
    modification to a specific performance evaluation activity. Keep to a limited
    number of specific, verifiable/validatable modifications.
  extracted_requirements:
  - For each planned modification: enumerate it individually with specific rationale
  - Link each modification to at least one specific performance evaluation activity
    in the Modification Protocol
  - Identify which labeling sections will be updated when each modification is implemented
  - Modifications must stay within the authorized intended use and indications for
    use
  - All modifications must be verifiable and/or validatable — vague modifications
    are rejected
  category: fda-guidance
- id: OBL-PCCP-003
  title: PCCP Modification Protocol
  source: FDA PCCP General Guidance (2024) §IV Three-Component Structure
  section: Modification Protocol
  scope_flags:
  - pccp
  - 510k
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - PCCP Document — Modification Protocol section
  - V&V Plan
  verbatim: 'Plans to V&V the modified device meets specifications for each modification.
    Plans to verify unmodified specifications are not impacted. Plans for V&V of entire
    device following each individual modification AND in aggregate. Study design,
    performance metrics, pre-defined acceptance criteria, and statistical tests. Affirmative
    statement: unresolvable performance failures prevent implementation.'
  extracted_requirements:
  - Define V&V methods and pre-specified acceptance criteria for each modification
    before implementing it
  - Include plans to verify that unmodified portions of the device are not degraded
    by each modification
  - Define V&V of the entire device (not just the modified function) following each
    modification
  - Include study design, performance metrics, statistical tests, and acceptance criteria
  - Include affirmative statement: if acceptance criteria cannot be met (unresolvable
      failure), the modification must not be implemented
  - Describe how the modification will be deployed to users (update procedure)
  - A traceability table linking each modification to its performance evaluation methods
    is required
  category: fda-guidance
- id: OBL-PCCP-004
  title: PCCP Impact Assessment
  source: FDA PCCP General Guidance (2024) §IV Three-Component Structure
  section: Impact Assessment
  scope_flags:
  - pccp
  - 510k
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - PCCP Document — Impact Assessment section
  - Risk Management File
  verbatim: Compare the version with each modification to the version without any
    modifications. Discuss benefits and risks (including risks of harm per ISO 14971)
    of each individual modification. Discuss how V&V activities continue to ensure
    safety and effectiveness. Discuss interactions — how implementation of one modification
    impacts another. Describe cumulative impact of implementing all modifications
    together.
  extracted_requirements:
  - For each modification: compare modified vs. unmodified device version (benefit-risk
      analysis)
  - Discuss risks of harm using ISO 14971 framework for each modification
  - Explain how the Modification Protocol V&V activities ensure continued safety and
    effectiveness
  - Assess interaction effects: how implementing modification A affects the safety/effectiveness
      of modification B
  - Assess cumulative impact of implementing all PCCP modifications together — not
    just individually
  - For MedTech Project (MFD): discuss impact on overall device functionality including
      both SaMD modules and Management Services
  category: fda-guidance
- id: OBL-PCCP-005
  title: PCCP Scope Risk Assessment
  source: FDA PCCP General Guidance (2024) §V Risk Assessment for 510(k) Devices
  section: Risk-Based Assessment
  scope_flags:
  - pccp
  - 510k
  topic: regulatory-submission
  artifact_type: analysis
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - PCCP Scope Determination
  - Change Impact Analysis
  verbatim: 'Could the modification be a major change to the intended use? If YES:
    generally NOT appropriate for PCCP. Could the modification introduce a NEW risk?
    If YES: generally NOT appropriate for PCCP. Could the modification significantly
    MODIFY an existing risk? If YES and risks adequately mitigated: generally MAY
    be appropriate.'
  extracted_requirements:
  - Conduct a risk-based assessment for each proposed modification to confirm PCCP
    appropriateness
  - Modifications that constitute major intended use changes are NOT eligible for
    PCCP
  - Modifications that introduce new risks (not existing in the cleared device) are
    NOT eligible for PCCP
  - Modifications that modify (not introduce) existing risks may be eligible if risks
    are adequately mitigated through the Modification Protocol
  - Document the risk assessment reasoning for each modification's PCCP eligibility
    in the Impact Assessment
  category: fda-guidance
- id: OBL-PCCP-006
  title: PCCP Version Control
  source: FDA PCCP General Guidance (2024) §VI Version Control
  section: Version Control and Maintenance
  scope_flags:
  - pccp
  - 510k
  topic: configuration-change
  artifact_type: process-record
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - PCCP Document
  - Design Change Records
  - UDI Records
  verbatim: 'Only one version of an authorized PCCP should exist per device at any
    time. A PCCP can evolve over time through future marketing submissions. FDA does
    not intend to re-review adequacy of modifications already implemented consistent
    with an authorized PCCP. For 510(k) devices: Predicate comparison is to the version
    pre-PCCP changes.'
  extracted_requirements:
  - Maintain only one version of the authorized PCCP per device at any time
  - PCCP modifications require a new marketing submission (new 510(k) to amend the
    PCCP)
  - Each PCCP-implemented change must be documented under the QMS design control process
    (§7.3.9)
  - New UDIs required when version/model numbers change following PCCP modifications
  - Labeling must NOT include descriptions of unimplemented modifications
  - Subsequent 510(k)s using a PCCP-modified device as predicate compare to the version
    BEFORE PCCP changes
  category: fda-guidance
- id: OBL-SWF-001
  title: Software Documentation Level
  source: FDA SW Functions Guidance (2023) §IV Documentation Levels
  section: Enhanced vs. Basic Documentation Level
  scope_flags:
  - 510k
  - common-baseline
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - 510(k) Submission — Software Documentation
  - Documentation Level Statement
  verbatim: Enhanced documentation required when failure or latent flaw of ANY device
    software function could present a hazardous situation with a probable risk of
    death or serious injury to a patient, user, or others, assessed prior to implementing
    risk control measures. The documentation level reflects the device as a whole
    — if any software function's failure could cause death/serious injury, enhanced
    documentation applies to the entire submission.
  extracted_requirements:
  - Determine documentation level (Basic or Enhanced) based on risk assessment — assessed
    BEFORE risk control measures
  - If ANY software function failure could cause death or serious injury pre-risk-controls
    → Enhanced documentation required for the entire submission
  - For MedTech Project: Intra-Op failure during surgery (e.g., corrupted guidance
      data) could cause serious injury → Enhanced documentation applies to the whole
      submission
  - Provide a written documentation level statement with rationale leveraging risk
    assessment and intended use
  - Class II is NOT automatically Basic — sponsor determines level based on risk assessment
  category: fda-guidance
- id: OBL-SWF-002
  title: SW Submission Documentation
  source: FDA SW Functions Guidance (2023) §V Required Documentation Elements
  section: Software Description + SRS + Architecture
  scope_flags:
  - 510k
  - common-baseline
  topic: regulatory-submission
  artifact_type: submission-content
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - 510(k) Submission — Software Documentation
  - SRS
  - Architecture Document
  verbatim: 'Comprehensive overview: significant features, analyses, inputs, outputs,
    hardware platforms. Software requirements specification — complete documentation
    of software requirements, organized format with traceability to other documentation
    elements. System and software architecture diagram — detailed diagrams of modules,
    layers, interfaces, data inputs/outputs/flow, user/external product interactions.'
  extracted_requirements:
  - Include a Software Description: overview of significant features, inputs, outputs,
      hardware platforms
  - For modified devices: description of changes from previous submission
  - Include a complete Software Requirements Specification (SRS) — must cover all
    requirements with traceability
  - Highlight safety-critical requirements and requirements modified since prior clearance
    (if applicable)
  - Include system and software architecture diagrams showing: modules, layers, interfaces,
      data flow, external interactions (IT infrastructure, imaging devices, PACS,
      tablet)
  - Architecture diagrams must show how all modules/functions interact including shared
    resources
  category: fda-guidance
- id: OBL-SWF-003
  title: SW Design Documentation
  source: FDA SW Functions Guidance (2023) §V Required Documentation Elements
  section: Software Design Specification (Enhanced)
  scope_flags:
  - 510k
  - common-baseline
  topic: design-outputs
  artifact_type: submission-content
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - 510(k) Submission — Software Documentation (Enhanced)
  - Software Design Document
  verbatim: 'Enhanced: Include SDS showing technical design details, how design implements
    SRS, and traceability from SDS to SRS. Basic: Not required in submission (document
    in Design History File).'
  extracted_requirements:
  - For Enhanced documentation (MedTech Project): include Software Design Specification
      in the submission
  - SDS must show: technical design details, how the design implements the SRS requirements,
      traceability from SDS to SRS
  - SDS traceability links design decisions to requirements — bidirectional trace
    required
  - For Basic documentation only: SDS stays in DHF, not submitted
  category: fda-guidance
- id: OBL-SWF-004
  title: SW Lifecycle Documentation
  source: FDA SW Functions Guidance (2023) §V Required Documentation Elements
  section: Software Development, CM, and Maintenance (IEC 62304)
  scope_flags:
  - 510k
  - common-baseline
  topic: software-lifecycle
  artifact_type: submission-content
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - 510(k) Submission — Software Documentation
  - IEC 62304 Declaration of Conformity
  verbatim: 'Option 1: Declaration of Conformity to FDA-recognized IEC 62304 (specific
    sections for basic vs. enhanced). Option 2 Without IEC 62304 conformity (Enhanced):
    Complete configuration management and maintenance plan + summary documentation.'
  extracted_requirements:
  - Option 1 (preferred): Submit a Declaration of Conformity to IEC 62304 — this substitutes
      for the SW development practices documentation section
  - For Enhanced: IEC 62304 conformance for Class C activities is required for the
      DoC to be accepted
  - If not using IEC 62304 DoC (Option 2, Enhanced): submit complete CM plan + full
      SW development summary
  - The DoC must reference the specific IEC 62304 edition and list the applicable
    clauses
  category: fda-guidance
- id: OBL-SWF-005
  title: SW Testing Documentation
  source: FDA SW Functions Guidance (2023) §V Required Documentation Elements
  section: Software Testing (V&V)
  scope_flags:
  - 510k
  - common-baseline
  topic: verification
  artifact_type: submission-content
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - 510(k) Submission — Software Testing
  - Test Protocols and Reports
  verbatim: 'Enhanced: Summary of unit, integration, and system-level testing + complete
    system-level test protocols and reports + full unit and integration level test
    protocols and reports. Basic: Summary of unit, integration, and system-level testing
    + complete system-level test protocols and reports only.'
  extracted_requirements:
  - For Enhanced documentation (MedTech Project): submit complete test protocols and
      reports at unit, integration, AND system levels
  - System-level test protocols and reports: required for both Basic and Enhanced
  - Unit and integration test protocols/reports: full submission required for Enhanced
      (not just summary)
  - Reference performance testing material across submission sections to reduce duplication
  - AI performance testing (algorithm validation studies) is part of the submission
    testing section
  category: fda-guidance
- id: OBL-SWF-006
  title: Unresolved Anomalies List
  source: FDA SW Functions Guidance (2023) §V Required Documentation Elements
  section: Software Version History + Unresolved Anomalies
  scope_flags:
  - 510k
  - common-baseline
  topic: software-lifecycle
  artifact_type: submission-content
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - 510(k) Submission — Software Documentation
  - Unresolved Anomalies List
  verbatim: 'History of tested software revisions: date, version number, brief description
    of changes. Last entry = final released version, including differences from tested
    version and safety/effectiveness assessment. List of remaining unresolved anomalies
    in tabular format. For each: description, how discovered, root cause, impact on
    safety/effectiveness, outcome of evaluation, risk-based rationale for not fixing.'
  extracted_requirements:
  - Include software version history from first version under design controls to the
    final released version
  - Last entry must document any differences between the tested version and the commercially
    released version with safety/effectiveness assessment
  - Include a complete list of known unresolved anomalies (bugs/defects not fixed
    at release)
  - For each unresolved anomaly: describe the defect, discovery method, root cause,
      safety/effectiveness impact, and risk-based rationale for why it was not fixed
  - No unresolved anomaly with patient safety impact can be left unjustified
  category: fda-guidance
- id: OBL-62304-001
  title: Software Safety Classification
  source: IEC 62304:2006+AMD1:2015 §4.3
  section: §4.3 — Software safety classification
  scope_flags: []
  topic: software-lifecycle
  artifact_type: record
  dhf_owner: item
  min_iec62304_class: A
  applies_to:
  - Safety Classification Record
  - Software Development Plan
  verbatim: '"The MANUFACTURER shall assign a software safety class (Class A, B, or
    C) to

    the SOFTWARE SYSTEM based on the severity of HAZARDOUS SITUATION that could

    result if the SOFTWARE SYSTEM should fail to behave as specified."

    '
  extracted_requirements:
  - Assign IEC 62304 safety class (A, B, or C) to each software item before development
    begins
  - Document the classification rationale referencing ISO 14971 severity levels
  - Record the classification in the Software Development Plan or a dedicated classification
    record
  - Re-evaluate classification if intended use or hazard analysis changes
  category: standards
- id: OBL-62304-002
  title: Software Development Plan
  source: IEC 62304:2006+AMD1:2015 §5.1.1
  section: §5.1 — Software development planning
  scope_flags: []
  topic: software-lifecycle
  artifact_type: plan
  dhf_owner: item
  min_iec62304_class: A
  applies_to:
  - Software Development Plan
  - Design and Development Plan
  verbatim: '"The MANUFACTURER shall establish a SOFTWARE DEVELOPMENT PLAN for conducting

    the activities of the software development process."

    '
  extracted_requirements:
  - Establish a Software Development Plan (SDP) before beginning software development
  - SDP may be part of the Design and Development Plan or a separate document
  - SDP must be updated to reflect actual development activities throughout the project
  category: standards
- id: OBL-62304-003
  title: SDP Content & Lifecycle
  source: IEC 62304:2006+AMD1:2015 §5.1.2 + §5.1.3
  section: §5.1 — Software development planning
  scope_flags: []
  topic: software-lifecycle
  artifact_type: plan
  dhf_owner: item
  min_iec62304_class: A
  applies_to:
  - Software Development Plan
  verbatim: '"The SOFTWARE DEVELOPMENT PLAN shall address: (a) the software development
    life cycle

    model including the activities and tasks to be performed and their sequencing;

    (b) the deliverables of the software development process and the criteria for
    their

    acceptance; (c) the standards, methods, and tools to be used; (d) traceability

    between software requirements and software system test cases."

    '
  extracted_requirements:
  - SDP must define the SDLC model (waterfall, iterative, agile-within-waterfall,
    etc.)
  - SDP must list planned deliverables with acceptance criteria for each
  - SDP must identify development standards, methods, and tools (including tool validation
    status)
  - SDP must describe the traceability approach from requirements to test cases
  - SDP must address configuration management, problem resolution, and risk management
    integration
  category: standards
- id: OBL-62304-004
  title: Software Requirements Specification
  source: IEC 62304:2006+AMD1:2015 §5.2.1
  section: §5.2 — Software requirements analysis
  scope_flags: []
  topic: requirements
  artifact_type: spec
  dhf_owner: item
  min_iec62304_class: A
  applies_to:
  - Software Requirements Specification
  verbatim: '"The MANUFACTURER shall define and document the SOFTWARE REQUIREMENTS
    from the

    SYSTEM REQUIREMENTS and the results of RISK MANAGEMENT activities."

    '
  extracted_requirements:
  - Define software requirements traceable to system-level requirements
  - Define software requirements traceable to risk management outputs (risk controls
    implemented in software)
  - Document requirements in a Software Requirements Specification (SRS)
  category: standards
- id: OBL-62304-005
  title: SRS Content Requirements
  source: IEC 62304:2006+AMD1:2015 §5.2.2 + §5.2.3
  section: §5.2 — Software requirements analysis
  scope_flags: []
  topic: requirements
  artifact_type: spec
  dhf_owner: item
  min_iec62304_class: A
  applies_to:
  - Software Requirements Specification
  verbatim: '"The software requirements shall include: functional and capability requirements;

    software system inputs and outputs; interfaces between the software system and

    other systems; software-operated alarms, warnings, and operator messages;

    security requirements; usability engineering requirements."

    '
  extracted_requirements:
  - 'SRS must cover: functional/capability requirements, I/O requirements, external
    interfaces'
  - SRS must address software-controlled alarms, warnings, and messages
  - SRS must include cybersecurity and usability requirements (for Class II SaMD)
  - All requirements must be verifiable (have defined acceptance criteria or test
    method)
  category: standards
- id: OBL-62304-006
  title: SRS Risk Control Trace
  source: IEC 62304:2006+AMD1:2015 §5.2.6
  section: §5.2 — Software requirements analysis
  scope_flags:
  - common-baseline
  topic: requirements
  artifact_type: record
  dhf_owner: item
  min_iec62304_class: A
  applies_to:
  - Software Requirements Specification
  - Risk Management File
  verbatim: '"The MANUFACTURER shall re-evaluate the RISK associated with the software

    after establishing the SOFTWARE REQUIREMENTS and update the RISK MANAGEMENT

    FILE as necessary."

    '
  extracted_requirements:
  - Re-evaluate risk after SRS is established — update risk file if new hazards emerge
  - Document this re-evaluation step in the risk management file or SRS changelog
  category: standards
- id: OBL-62304-007
  title: Software Architecture Specification
  source: IEC 62304:2006+AMD1:2015 §5.3.1
  section: §5.3 — Software architectural design
  scope_flags: []
  topic: architecture
  artifact_type: spec
  dhf_owner: item
  min_iec62304_class: B
  applies_to:
  - Software Architecture Document
  verbatim: '"The MANUFACTURER shall transform the SOFTWARE REQUIREMENTS into a documented

    architecture that describes the structure of the software and identifies the

    SOFTWARE ITEMS."

    '
  extracted_requirements:
  - Produce a Software Architecture Document (SAD) transforming the SRS into a structural
    design
  - SAD must identify and name all software items (decomposition to the unit level
    is not required at this stage)
  - SAD must describe the interfaces between software items and between the software
    and hardware/external systems
  category: standards
- id: OBL-62304-008
  title: SOUP Identification
  source: IEC 62304:2006+AMD1:2015 §5.3.3
  section: §5.3 — Software architectural design
  scope_flags: []
  topic: architecture
  artifact_type: record
  dhf_owner: item
  min_iec62304_class: B
  applies_to:
  - SOUP List
  - Software Architecture Document
  verbatim: '"The MANUFACTURER shall identify SOUP items including: (a) the title,
    manufacturer,

    and unique SOUP designator; (b) the requirements for the SOUP item."

    '
  extracted_requirements:
  - Identify all SOUP (Software of Unknown Provenance) items used in each software
    item
  - 'For each SOUP item: document title, manufacturer/supplier, version, and required
    functional/performance requirements'
  - Maintain a SOUP list as a controlled document — update on each SOUP change
  category: standards
- id: OBL-62304-009
  title: Architecture Verification
  source: IEC 62304:2006+AMD1:2015 §5.3.4
  section: §5.3 — Software architectural design
  scope_flags: []
  topic: architecture
  artifact_type: record
  dhf_owner: item
  min_iec62304_class: B
  applies_to:
  - Software Architecture Document
  - Architecture Verification Record
  verbatim: '"The MANUFACTURER shall verify that the software architecture implements
    all

    software requirements and identify potential causes of hazardous situations."

    '
  extracted_requirements:
  - Conduct and document an architecture verification that confirms all SRS requirements
    are addressed in the design
  - As part of architecture verification, evaluate whether the architecture could
    cause or fail to mitigate hazardous situations
  - Record the verification outcome (pass/fail per requirement) in the SAD or a separate
    verification record
  category: standards
- id: OBL-62304-010
  title: Detailed Software Design
  source: IEC 62304:2006+AMD1:2015 §5.4.1
  section: §5.4 — Software detailed design
  scope_flags: []
  topic: design-outputs
  artifact_type: spec
  dhf_owner: item
  min_iec62304_class: C
  applies_to:
  - Software Design Document
  - Software Detailed Design
  verbatim: '"The MANUFACTURER shall refine the software architecture until it is
    represented

    by SOFTWARE UNITS that can be implemented and verified."

    '
  extracted_requirements:
  - Decompose the architecture into software units (leaf-level components that can
    be individually implemented and tested)
  - Document the detailed design for each software unit with sufficient detail to
    permit implementation without ambiguity
  - Verify that the detailed design implements the software architecture (no requirement
    left unaddressed)
  category: standards
- id: OBL-62304-011
  title: Unit Verification
  source: IEC 62304:2006+AMD1:2015 §5.5.2 + §5.5.3
  section: §5.5 — Software unit implementation
  scope_flags: []
  topic: verification
  artifact_type: record
  dhf_owner: item
  min_iec62304_class: B
  applies_to:
  - Unit Verification Records
  - Code Review Records
  verbatim: '"The MANUFACTURER shall verify SOFTWARE UNITS. The verification shall
    confirm that

    the units implement the design and are free of common programming errors."

    '
  extracted_requirements:
  - Verify each software unit through code review, unit testing, or both
  - 'Class C: unit testing is required; define test cases per the detailed design'
  - 'Class B: code review of each unit is sufficient (testing not mandated but recommended)'
  - Record verification results — pass/fail per unit, reviewer/tester identity, date
  category: standards
- id: OBL-62304-012
  title: Integration Testing
  source: IEC 62304:2006+AMD1:2015 §5.6.1 + §5.6.3
  section: §5.6 — Software integration
  scope_flags: []
  topic: verification
  artifact_type: protocol
  dhf_owner: item
  min_iec62304_class: B
  applies_to:
  - Integration Test Plan
  - Integration Test Report
  verbatim: '"The MANUFACTURER shall integrate the SOFTWARE ITEMS and verify that
    the

    integrated SOFTWARE ITEMS implement the software architecture and satisfy

    the SOFTWARE REQUIREMENTS."

    '
  extracted_requirements:
  - Produce an integration plan defining the sequence and method for integrating software
    items
  - Conduct integration testing at each integration step and upon full integration
  - Integration tests must verify that integrated software satisfies the SRS
  - Document integration test results with pass/fail per test case and anomalies found
  category: standards
- id: OBL-62304-013
  title: System Testing
  source: IEC 62304:2006+AMD1:2015 §5.7.1 + §5.7.3
  section: §5.7 — Software system testing
  scope_flags: []
  topic: validation
  artifact_type: protocol
  dhf_owner: item
  min_iec62304_class: A
  applies_to:
  - Software System Test Plan
  - Software System Test Report
  verbatim: '"The MANUFACTURER shall test the SOFTWARE SYSTEM for conformance to the
    SOFTWARE

    REQUIREMENTS. The testing shall include boundary conditions and stress conditions

    and shall check for ANOMALIES."

    '
  extracted_requirements:
  - Test the complete integrated software system against every SRS requirement
  - Test must include normal operating conditions, boundary conditions, stress conditions,
    and foreseeable misuse
  - Document a System Test Plan before testing begins; document results in a System
    Test Report
  - All test anomalies must be evaluated and resolved before release
  category: standards
- id: OBL-62304-014
  title: Software Release
  source: IEC 62304:2006+AMD1:2015 §5.8.1 + §5.8.3 + §5.8.7
  section: §5.8 — Software release
  scope_flags: []
  topic: configuration-change
  artifact_type: record
  dhf_owner: item
  min_iec62304_class: A
  applies_to:
  - Software Release Package
  - Release Checklist
  verbatim: '"The MANUFACTURER shall ensure that the software is released only when:
    all

    software development activities are complete; the software configuration

    is documented; known ANOMALIES are evaluated and their impact on safety

    is acceptable; the software version identifier is assigned."

    '
  extracted_requirements:
  - Assign a unique version identifier to the released software (must be traceable
    in the DHF)
  - Document all known anomalies at release with their safety impact evaluation
  - Produce a release checklist confirming all §5 development activities are complete
  - Record the released configuration (version of each software item, SOUP versions,
    build environment)
  category: standards
- id: OBL-62304-015
  title: Software Maintenance Plan
  source: IEC 62304:2006+AMD1:2015 §6.1
  section: §6 — Software maintenance process
  scope_flags:
  - pccp
  topic: post-market
  artifact_type: plan
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Software Maintenance Plan
  - Software Development Plan
  verbatim: '"The MANUFACTURER shall establish and document a SOFTWARE MAINTENANCE
    PLAN.

    The plan shall address: problem and modification analysis; modification

    implementation; release of modifications."

    '
  extracted_requirements:
  - Establish a Software Maintenance Plan (may be part of SDP or a separate document)
  - 'Maintenance plan must address: how post-market problems are analyzed, how modifications
    are scoped and implemented, how modified releases are managed'
  - PCCP changes must follow the maintenance process — classify the change, evaluate
    safety impact, implement per §5 process appropriate to the classification
  category: standards
- id: OBL-62304-016
  title: Software Hazard Analysis
  source: IEC 62304:2006+AMD1:2015 §7.1.1
  section: §7 — Software risk management
  scope_flags: []
  topic: risk-management
  artifact_type: record
  dhf_owner: item
  min_iec62304_class: B
  applies_to:
  - Risk Management File
  - Software FMEA
  - Hazard Analysis
  verbatim: '"The MANUFACTURER shall identify SOFTWARE ITEMS that could contribute
    to a

    HAZARDOUS SITUATION. For each such SOFTWARE ITEM, the MANUFACTURER shall

    evaluate the contribution of the SOFTWARE ITEM to the HAZARDOUS SITUATION."

    '
  extracted_requirements:
  - For each hazardous situation in the risk file, identify which software items could
    contribute to it
  - Evaluate how and to what degree each software item contributes (causal analysis)
  - Document results in a software risk analysis record — typically a software FMEA
    or hazard analysis table
  category: standards
- id: OBL-62304-017
  title: SOUP Risk Evaluation
  source: IEC 62304:2006+AMD1:2015 §7.1.3
  section: §7 — Software risk management
  scope_flags: []
  topic: risk-management
  artifact_type: record
  dhf_owner: item
  min_iec62304_class: B
  applies_to:
  - Risk Management File
  - SOUP Risk Evaluation
  verbatim: '"The MANUFACTURER shall evaluate the ANOMALY LISTS and reported PROBLEMS
    for

    SOUP items and shall determine whether the anomalies or reported problems are

    relevant to the SOFTWARE SYSTEM and document the conclusions."

    '
  extracted_requirements:
  - For each SOUP item, obtain and review the supplier's known anomaly list
  - Evaluate whether any known anomaly could affect the safety of the software system
  - Document the evaluation conclusion (relevant / not relevant / mitigated) in the
    risk management file
  - Repeat evaluation when a new SOUP version is adopted or new anomalies are reported
  category: standards
- id: OBL-62304-018
  title: Software Configuration Management
  source: IEC 62304:2006+AMD1:2015 §8.1.1 + §8.1.2
  section: §8 — Software configuration management
  scope_flags: []
  topic: configuration-change
  artifact_type: plan
  dhf_owner: item
  min_iec62304_class: B
  applies_to:
  - Configuration Management Plan
  - Software Development Plan
  verbatim: '"The MANUFACTURER shall establish and document a SOFTWARE CONFIGURATION

    MANAGEMENT PLAN that includes: identification of configuration items;

    change control procedures; status accounting; configuration audits."

    '
  extracted_requirements:
  - Establish a Configuration Management Plan (may be part of SDP)
  - 'CM plan must define: what is a configuration item, how items are labeled/versioned,
    how changes are controlled, how configuration status is tracked'
  - 'Configuration items must include: software items, test cases, tools, SOUP versions,
    build scripts, and DHF documents'
  category: standards
- id: OBL-62304-019
  title: Problem Resolution Process
  source: IEC 62304:2006+AMD1:2015 §9.1
  section: §9 — Software problem resolution
  scope_flags: []
  topic: post-market
  artifact_type: record
  dhf_owner: system
  min_iec62304_class: B
  applies_to:
  - Problem Resolution Process
  - Software Maintenance Plan
  verbatim: '"The MANUFACTURER shall establish and document a SOFTWARE PROBLEM RESOLUTION

    PROCESS that includes: problem reporting, analysis, resolution and verification,

    release of modified software, communication of resolution to relevant parties."

    '
  extracted_requirements:
  - 'Establish a problem resolution process covering: receipt, investigation, resolution,
    and closure'
  - 'Each problem must be evaluated for: safety impact, causal analysis, resolution
    approach'
  - Problem resolution records must be maintained — linked to the affected software
    version and release
  - Post-market problems feed back into the risk management file when they reveal
    new hazards
  category: standards
- id: OBL-62304-020
  title: Software Traceability
  source: IEC 62304:2006+AMD1:2015 §5.1.6(d)
  section: §5.1 — Software development planning (traceability)
  scope_flags: []
  topic: traceability
  artifact_type: record
  dhf_owner: item
  min_iec62304_class: A
  applies_to:
  - Trace Matrix
  - Software Development Plan
  verbatim: '"The SOFTWARE DEVELOPMENT PLAN shall address traceability between: software

    requirements and system requirements; software requirements and software system

    tests; software requirements and software architecture; and for Class C, between

    software requirements and software units."

    '
  extracted_requirements:
  - 'Maintain bidirectional traceability: system requirements → software requirements
    → architecture → test cases'
  - 'Class C additional: software requirements → individual software units'
  - Document the traceability approach in the SDP
  - Produce a trace matrix as the formal traceability deliverable
  category: standards
- id: OBL-62366-001
  title: Usability Engineering Plan
  source: IEC 62366-1:2015 §4.1
  section: 4.1 — Usability Engineering Process
  scope_flags:
  - common-baseline
  topic: human-factors
  artifact_type: plan
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Usability Engineering Plan
  - Design and Development Plan
  verbatim: Establish and maintain a usability engineering process. The process must
    be integrated with the overall design and development process. Usability engineering
    activities must be traceable to the risk management process (ISO 14971).
  extracted_requirements:
  - Establish a usability engineering process and maintain it throughout the development
    lifecycle
  - Integrate the usability engineering process with the design and development process
    (DDP)
  - Ensure traceability between usability engineering activities and the risk management
    process
  category: standards
- id: OBL-62366-002
  title: Use Specification
  source: IEC 62366-1:2015 §5.1.1
  section: 5.1.1 — Intended Users
  scope_flags:
  - common-baseline
  topic: human-factors
  artifact_type: specification
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Use Specification
  - Usability Engineering File
  verbatim: 'Identify and characterize intended users. Consider: clinical role, training
    level, experience, physical capabilities.'
  extracted_requirements:
  - Identify and characterize the intended users for each use scenario
  - Consider user attributes including clinical role, training level, prior experience
    with similar devices, and physical capabilities
  - Document separate user profiles per module where user populations differ
  category: standards
- id: OBL-62366-003
  title: User Profiles & Environments
  source: IEC 62366-1:2015 §5.1.2
  section: 5.1.2 — Intended Use Environment
  scope_flags:
  - common-baseline
  topic: human-factors
  artifact_type: specification
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Use Specification
  - Usability Engineering File
  verbatim: 'Document the use environment for each use scenario. Consider: lighting,
    noise, sterility, time pressure, distractions, PPE.'
  extracted_requirements:
  - Document the intended use environment for each module
  - Address: ambient lighting, noise level, sterility requirements, time pressure,
      concurrent distractions, required PPE
  - Distinguish between OR and non-OR environments — Intra-Op operates in a sterile
    surgical field, Pre-Op in a clinic office
  category: standards
- id: OBL-62366-004
  title: Use-Related Risk Analysis
  source: IEC 62366-1:2015 §5.2
  section: 5.2 — Use-Related Risk Analysis
  scope_flags:
  - common-baseline
  topic: human-factors
  artifact_type: analysis
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Use-Related Risk Analysis
  - Usability Engineering File
  - Risk Management File
  verbatim: Identify hazards and hazardous situations related to use. Identify potential
    use errors and their causes. Evaluate the severity and probability of harm from
    use errors. Feed use-related risks into the ISO 14971 risk management process.
  extracted_requirements:
  - Identify all potential use errors per module — perception errors, cognitive errors,
    action errors
  - Identify the hazardous situation and potential harm sequence for each use error
  - Evaluate severity and probability of harm from each use error
  - Feed use-related risks into the ISO 14971 risk management process (risk inputs,
    not standalone)
  - Critical use error categories for SaMD: misread measurements, missed alerts, incorrect
      plan selection, wrong patient data confirmation
  category: standards
- id: OBL-62366-005
  title: User Interface Specification
  source: IEC 62366-1:2015 §5.3
  section: 5.3 — User Interface Specification
  scope_flags:
  - common-baseline
  topic: human-factors
  artifact_type: specification
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - User Interface Specification
  - Software Requirements Specification
  verbatim: 'Establish the user interface specification from use specification and
    risk analysis. Specify: information presentation, controls, navigation, feedback,
    error prevention. Include measurable acceptance criteria for critical use scenarios.'
  extracted_requirements:
  - Establish a UI specification derived from the use specification and use-related
    risk analysis
  - Specify: information presentation, controls, navigation, feedback mechanisms,
      error prevention features
  - Define measurable acceptance criteria for critical use scenarios (tasks where
    use error could cause harm)
  - Critical use scenarios must be explicitly identified and flagged in the specification
  category: standards
- id: OBL-62366-006
  title: UI Verification
  source: IEC 62366-1:2015 §5.5
  section: 5.5 — Verification of User Interface
  scope_flags:
  - common-baseline
  topic: verification
  artifact_type: test-report
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - UI Verification Report
  - V&V Plan
  verbatim: Verify the user interface meets the user interface specification. Include
    inspection, analysis, and testing methods. Verify risk control measures related
    to usability are implemented.
  extracted_requirements:
  - Verify the implemented user interface meets the UI specification requirements
  - Use inspection, analysis, and testing methods as appropriate
  - Verify that all usability-related risk control measures from the use-related risk
    analysis are implemented and effective
  category: standards
- id: OBL-62366-007
  title: Formative Usability Evaluation
  source: IEC 62366-1:2015 §5.6
  section: 5.6 — User Interface Evaluation (Formative)
  scope_flags:
  - common-baseline
  topic: validation
  artifact_type: test-report
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Formative Evaluation Reports
  - Usability Engineering File
  verbatim: 'Evaluate the user interface with representative users in representative
    environments (formative phase). Methods: cognitive walkthrough, heuristic evaluation,
    usability testing with think-aloud. Can be done with simulated environments and
    prototype interfaces. Multiple rounds expected.'
  extracted_requirements:
  - Conduct iterative formative usability evaluations during design
  - Use representative users (or similar proxies) in representative or simulated environments
  - Methods include: cognitive walkthrough, heuristic evaluation, think-aloud usability
      testing
  - Multiple rounds expected — findings must be fed back into design changes
  - Document findings, design changes made in response, and rationale for accepted
    vs. deferred findings
  category: standards
- id: OBL-62366-008
  title: Summative Usability Validation
  source: IEC 62366-1:2015 §5.6
  section: 5.6 — User Interface Evaluation (Summative)
  scope_flags:
  - common-baseline
  topic: validation
  artifact_type: test-report
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Summative Usability Evaluation Report
  - 510(k) Submission
  verbatim: 'Evaluate the user interface with representative users in representative
    environments (summative phase). Must use production-equivalent device in representative
    use environment. Must include statistical evidence that critical tasks can be
    completed safely. Deliverable: Summative Usability Evaluation Report.'
  extracted_requirements:
  - Conduct a final summative usability evaluation before market release
  - Use production-equivalent device and representative use environment (or validated
    simulation)
  - Include representative users — matching the intended user profiles defined in
    §5.1.1
  - Evaluate all critical tasks defined in the UI specification
  - Demonstrate with statistical evidence (task completion rates, error rates) that
    critical tasks can be completed safely
  - Document: participant profiles, tasks tested, acceptance criteria, results, use
      errors observed and their root cause
  - Summative Usability Evaluation Report is required in the 510(k) submission for
    Class II SaMD
  category: standards
- id: OBL-62366-009
  title: UOUP Evaluation
  source: IEC 62366-1:2015 §5.7
  section: 5.7 — User Interface of Unknown Provenance (UOUP)
  scope_flags:
  - common-baseline
  topic: human-factors
  artifact_type: analysis
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - UOUP Evaluation
  - Usability Engineering File
  verbatim: If reusing an existing user interface or UI components, evaluate them
    using this process. Applicable when using third-party UI frameworks or pre-built
    components in the clinical interface.
  extracted_requirements:
  - If third-party UI frameworks or pre-built components are used in the clinical
    interface, evaluate them under the UOUP process
  - UOUP evaluation requires demonstrating that reused UI components meet the usability
    requirements for the device's intended use
  - Document the evaluation rationale — what was evaluated, how, and what was accepted
    or rejected
  category: standards
- id: OBL-81001-001
  title: Security Risk Management Plan
  source: IEC 81001-5-1:2021 §4.2
  section: 4.2 — Security Risk Management
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: cybersecurity
  artifact_type: plan
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Security Risk Assessment
  - Risk Management Plan
  - Software Development Plan
  verbatim: 'Integrate security risk management into the overall risk management process
    (ISO 14971). Security risk management must consider: confidentiality, integrity,
    availability. Apply throughout the entire lifecycle.'
  extracted_requirements:
  - Integrate security risk management with the ISO 14971 risk management process
    — security risks must appear in the device risk file
  - Security risk assessments must address three properties: confidentiality, integrity,
      and availability (CIA triad)
  - Apply security risk management throughout the entire product lifecycle (not just
    development)
  category: standards
- id: OBL-81001-002
  title: Secure Development Plan
  source: IEC 81001-5-1:2021 §5.1
  section: 5.1 — Software Development Planning — Security
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: software-lifecycle
  artifact_type: plan
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Software Development Plan
  - Cybersecurity Plan
  verbatim: 'Include security activities in the software development plan. Plan must
    address: threat modeling, secure design principles, security testing, vulnerability
    management. Define security requirements sources (regulatory, standards, organizational
    policies).'
  extracted_requirements:
  - Include security activities in the SDP: threat modeling, secure design, security
      testing, vulnerability management
  - Identify security requirements sources: FDA cybersecurity guidance, IEC 81001-5-1,
      organizational security policies
  - Define the process for tracking and resolving security issues throughout development
  category: standards
- id: OBL-81001-003
  title: Security Requirements
  source: IEC 81001-5-1:2021 §5.2
  section: 5.2 — Health Software Requirements — Security
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: requirements
  artifact_type: specification
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Software Requirements Specification
  - Security Requirements
  verbatim: 'Derive security requirements from: security risk assessment, regulatory
    requirements, intended use environment threat landscape, data protection requirements
    (PHI/PII if applicable). Security requirements must cover: authentication and
    access control, authorization and privilege management, audit logging and accountability,
    data confidentiality (at rest and in transit), data integrity, secure communication,
    software update/patch mechanisms, cryptographic controls.'
  extracted_requirements:
  - Derive security requirements from security risk assessment + FDA cybersecurity
    guidance + PHI/PII obligations
  - SRS must include security requirements covering: authentication, access control,
      role-based authorization, audit logging
  - SRS must cover data protection: confidentiality at rest and in transit, data integrity,
      encryption standards
  - SRS must address software update security: authenticated OTA update mechanism
      with integrity verification
  - SRS must specify cryptographic controls: approved algorithms, key management,
      certificate handling
  category: standards
- id: OBL-81001-004
  title: Secure Software Architecture
  source: IEC 81001-5-1:2021 §5.3
  section: 5.3 — Software Architectural Design — Security
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: architecture
  artifact_type: design-document
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Software Architecture Document
  - Security Architecture
  verbatim: 'Apply secure design principles: defense in depth, least privilege, secure
    defaults, fail secure, separation of duties, minimize attack surface. Document
    security architecture decisions. Identify trust boundaries between components.'
  extracted_requirements:
  - Apply secure design principles in the SAD: defense in depth, least privilege,
      secure defaults, fail secure, minimize attack surface
  - Document security architecture decisions as architectural records
  - Identify and explicitly document trust boundaries between components (SaMD/non-SaMD
    boundary is a trust boundary)
  - Separation of duties must be reflected in the architecture (e.g., Management Services
    cannot alter Intra-Op clinical data unilaterally)
  category: standards
- id: OBL-81001-005
  title: Secure Detailed Design
  source: IEC 81001-5-1:2021 §5.5
  section: 5.5 — Software Implementation — Security
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: software-lifecycle
  artifact_type: process-record
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Secure Coding Standard
  - SOUP List
  - Software Development Process Records
  verbatim: Follow secure coding standards. Use static analysis tools to detect vulnerabilities.
    Perform code reviews with security focus. Manage third-party components (SOUP)
    for known vulnerabilities.
  extracted_requirements:
  - Follow a defined secure coding standard (e.g., OWASP, CERT C, or equivalent)
  - Use static analysis (SAST) tools in the CI/CD pipeline to detect common vulnerability
    patterns
  - Conduct security-focused code reviews for high-risk components
  - Track SOUP/third-party dependencies for known vulnerabilities (CVE/NVD monitoring)
  category: standards
- id: OBL-81001-006
  title: Secure Implementation Practices
  source: IEC 81001-5-1:2021 §5.7
  section: 5.7 — Software System Testing — Security
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: verification
  artifact_type: test-report
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Security Test Report
  - V&V Plan
  verbatim: 'Conduct security testing of the complete system: vulnerability scanning,
    penetration testing, fuzz testing, security regression testing. Test against known
    vulnerability databases (CVE, NVD).'
  extracted_requirements:
  - Conduct system-level security testing before release: vulnerability scanning,
      penetration testing
  - Include fuzz testing for network-facing and data-parsing components (DICOM ingestion,
    OTA update receiver)
  - Run security regression testing after code changes that affect security-relevant
    components
  - Verify security controls against the CVE/NVD database — no unmitigated high-severity
    known vulnerabilities at release
  category: standards
- id: OBL-81001-007
  title: Security Verification Testing
  source: IEC 81001-5-1:2021 §5.8
  section: 5.8 — Software Release — Security
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: configuration-change
  artifact_type: release-record
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - SBOM
  - Security Release Notes
  - Software Release Package
  verbatim: 'Document known security vulnerabilities and mitigations at release. Provide
    security guidance for deployment. Generate Software Bill of Materials (SBOM).
    SBOM must include: component name, version, supplier, dependency relationship,
    author, timestamp. Machine-readable format required (SPDX or CycloneDX).'
  extracted_requirements:
  - Generate a machine-readable SBOM at release (SPDX or CycloneDX format)
  - SBOM must cover all software components including SOUP/third-party libraries
  - SBOM fields required: component name, version, supplier, dependency relationship,
      author, timestamp
  - Document known residual security vulnerabilities at release with severity and
    mitigation status
  - Provide deployment security guidance (network configuration requirements, hardening
    recommendations)
  category: standards
- id: OBL-81001-008
  title: Secure Release
  source: IEC 81001-5-1:2021 §6.1
  section: 6.1 — Security Monitoring (Post-Market)
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: post-market
  artifact_type: plan
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Vulnerability Management Plan
  - Post-Market Surveillance Plan
  verbatim: Continuously monitor for new vulnerabilities affecting the software and
    its components. Monitor vulnerability databases and SOUP vendor advisories. Establish
    a coordinated vulnerability disclosure process.
  extracted_requirements:
  - Establish a continuous post-market vulnerability monitoring process
  - Monitor NVD/CVE databases and SOUP vendor advisories for all components in the
    SBOM
  - Define severity thresholds and response timelines (e.g., critical CVEs must be
    assessed within N days)
  - Establish a coordinated vulnerability disclosure process for third-party security
    researchers to report vulnerabilities
  category: standards
- id: OBL-81001-009
  title: Post-Market Security Maintenance
  source: IEC 81001-5-1:2021 §7.1
  section: 7.1 — Threat Modeling
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: cybersecurity
  artifact_type: analysis
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Threat Model
  - Security Risk Assessment
  verbatim: Identify assets (data, functions, interfaces). Identify threat agents
    (malicious users, malware, insider threats, network attackers). Identify threats
    using a systematic method (STRIDE, attack trees, etc.). Identify vulnerabilities
    that could be exploited.
  extracted_requirements:
  - Conduct a systematic threat model covering: assets (patient data, guidance algorithms,
      system configuration), threat agents (network attackers, malicious insiders,
      compromised SOUP), and threats (STRIDE categories)
  - Use a structured methodology: STRIDE, attack trees, or equivalent
  - Identify vulnerabilities exploitable by the identified threats
  - Threat model must cover all trust boundaries identified in the SAD
  category: standards
- id: OBL-81001-010
  title: Security Records & SBOM
  source: IEC 81001-5-1:2021 §9
  section: 9 — Problem Resolution — Security
  scope_flags:
  - cybersecurity
  - common-baseline
  topic: post-market
  artifact_type: plan
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Security Incident Response Plan
  - Post-Market Surveillance Plan
  verbatim: Establish a security incident response process. Define severity classification
    for security issues. Track security problems to resolution. Report security incidents
    per regulatory requirements.
  extracted_requirements:
  - Define and document a security incident response process
  - Classify security incidents by severity (e.g., patient safety impact, data breach
    severity)
  - Track all security incidents and vulnerabilities from identification to resolution
  - Report security incidents to FDA per MDR/MAUDE requirements when patient safety
    is affected
  - Coordinate with MedTech Company post-market surveillance for cybersecurity-triggered
    adverse event reporting
  category: standards
- id: OBL-82304-001
  title: Health Software Requirements
  source: IEC 82304-1:2016 §4.2
  section: 4.2 — Risk Management
  scope_flags:
  - common-baseline
  topic: risk-management
  artifact_type: plan
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Risk Management Plan
  - Risk Management File
  verbatim: 'Apply risk management per ISO 14971 to the health software product. Risk
    management must cover the full product lifecycle. Include risks from: intended
    use environment, interoperability, data migration, IT security.'
  extracted_requirements:
  - Apply ISO 14971 risk management at the product level (IEC 82304-1 mandates this;
    does not define its own risk process)
  - Risk management must span the full product lifecycle including maintenance and
    decommissioning
  - Risk assessment must include risks from: intended use environment, system interoperability,
      data migration, IT/cybersecurity threats
  category: standards
- id: OBL-82304-002
  title: Safety Requirements Specification
  source: IEC 82304-1:2016 §4.3
  section: 4.3 — Software Development
  scope_flags:
  - common-baseline
  topic: software-lifecycle
  artifact_type: process-record
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Software Development Plan
  - IEC 62304 Conformance Records
  verbatim: Software development must conform to IEC 62304. This is where the two
    standards connect — IEC 82304-1 requires IEC 62304 compliance.
  extracted_requirements:
  - All software development activities must conform to IEC 62304
  - IEC 82304-1 does not add development obligations beyond IEC 62304 — it mandates
    IEC 62304 conformance as the mechanism
  - Conformance records for IEC 62304 serve as the evidence base for IEC 82304-1 §4.3
    compliance
  category: standards
- id: OBL-82304-003
  title: Product Validation Planning
  source: IEC 82304-1:2016 §5.1
  section: 5.1 — Intended Use and Operating Environment
  scope_flags:
  - common-baseline
  topic: requirements
  artifact_type: specification
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Device Description
  - Intended Use Statement
  - Software Requirements Specification
  verbatim: Define the intended use of the health software product. Define the intended
    operating environment (hardware, OS, network, interfacing systems). Define the
    intended user profile.
  extracted_requirements:
  - Define the intended use of the health software product (maps to the FDA Indications
    for Use Statement)
  - Define the intended operating environment: hardware platforms, OS versions, network
      requirements, interfacing systems (DICOM, PACS, C-arm)
  - Define the intended user profile (maps to IEC 62366-1 §5.1.1 user characterization)
  category: standards
- id: OBL-82304-004
  title: Product Validation Execution
  source: IEC 82304-1:2016 §5.2
  section: 5.2 — Health Software Product Safety Requirements
  scope_flags:
  - common-baseline
  topic: requirements
  artifact_type: specification
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Software Requirements Specification
  - Risk Control Requirements
  verbatim: 'Derive safety requirements from risk management activities. Include requirements
    for: data integrity, access control, confidentiality, audit trails. Address requirements
    for IT-network integration. Consider degraded performance modes.'
  extracted_requirements:
  - Safety requirements must be derived from risk management (ISO 14971) activities
    — not authored independently
  - SRS must include requirements for: data integrity (guidance data cannot be silently
      corrupted), access control (patient data access scoped to authorized users),
      confidentiality (PHI protection), audit trails (who accessed/modified what data)
  - Address IT-network integration requirements (what happens when cloud sync is unavailable
    — Intra-Op must remain operable)
  - Define and specify degraded performance modes (graceful degradation when full
    capabilities unavailable)
  category: standards
- id: OBL-82304-005
  title: Accompanying Documents
  source: IEC 82304-1:2016 §6.1
  section: 6.1 — Health Software Product Life Cycle Plan
  scope_flags:
  - common-baseline
  topic: software-lifecycle
  artifact_type: plan
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Software Development Plan
  - Product Lifecycle Plan
  verbatim: 'Plan must cover the entire product lifecycle. Include provisions for:
    product deployment, operation, maintenance, and decommissioning.'
  extracted_requirements:
  - The SDP (or a companion lifecycle plan) must address the full product lifecycle beyond development: deployment,
      post-market operation, maintenance, and decommissioning
  - Define the planned product lifecycle: expected support period, planned major version
      cadence, end-of-support criteria
  - Address decommissioning requirements: data archival, patient safety during transition,
      user notification timeline
  category: standards
- id: OBL-82304-006
  title: Post-Market Surveillance Plan
  source: IEC 82304-1:2016 §8.2
  section: 8.2 — Validation
  scope_flags:
  - common-baseline
  topic: validation
  artifact_type: test-report
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Validation Report
  - Clinical Evaluation
  - V&V Plan
  verbatim: Validate the health software product in the intended operating environment.
    Validation must demonstrate the product meets user needs and intended uses.
  extracted_requirements:
  - Validate MedTech Project in the intended operating environment (or validated simulation)
    — not just on a development server
  - Validation must demonstrate the product meets all defined user needs and the intended
    use statement
  - For SaMD with AI components, validation must include clinical performance testing
    (algorithm performance on representative patient data)
  category: standards
- id: OBL-82304-007
  title: Post-Market Problem Resolution
  source: IEC 82304-1:2016 §9.2
  section: 9.2 — Accompanying Documents
  scope_flags:
  - common-baseline
  topic: labeling-ifu
  artifact_type: labeling
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Instructions for Use
  - User Documentation
  - Labeling
  verbatim: 'User documentation must include: intended use, operating environment
    requirements, installation instructions, user instructions, known limitations,
    security guidance.'
  extracted_requirements:
  - IFU / user documentation must explicitly state: intended use, intended operating
      environment (hardware, OS, network requirements)
  - Include installation and configuration instructions for the operating environment
  - Document known limitations and contraindications
  - Include security guidance for users: network configuration, access control setup,
      update process
  - For each PCCP change that modifies user-facing behavior, update the IFU accordingly
  category: standards
- id: OBL-82304-008
  title: Decommissioning Plan
  source: IEC 82304-1:2016 §11
  section: 11 — Health Software Product Decommissioning
  scope_flags:
  - common-baseline
  topic: post-market
  artifact_type: plan
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Product Lifecycle Plan
  - Post-Market Surveillance Plan
  verbatim: Plan for orderly decommissioning of the software product. Address data
    migration, archival, and patient safety during transition. Notify users of decommissioning
    timeline and alternatives.
  extracted_requirements:
  - Define a decommissioning plan covering: data archival (surgical case records,
      patient data), migration path for active users, patient safety during service
      transition
  - Define the user notification timeline and process for end-of-support and decommissioning
    events
  - Address data retention obligations under applicable regulations (HIPAA records
    retention, FDA MDR records)
  category: standards
- id: OBL-13485-001
  title: Design & Development Planning
  source: ISO 13485:2016 §7.3.2
  section: 7.3.2 — Design and Development Planning
  scope_flags:
  - common-baseline
  topic: software-lifecycle
  artifact_type: plan
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Design and Development Plan
  - Software Development Plan
  verbatim: How does the organization plan and control the design and development
    of product? Is there evidence that the organization documents the following? (a)
    Stages of design and development; (b) Reviews needed at these stages; (c) Appropriate
    activities at these stages (e.g. verification, validation, transfer); (d) The
    responsibility and authority for design and development; (e) The methods to ensure
    that outputs trace back to inputs; (f) Resources needed including necessary personnel
    competencies needed.
  extracted_requirements:
  - Document the stages of design and development with defined entry/exit criteria
  - Identify the design reviews required at each stage and the responsible parties
  - Define verification, validation, and design transfer activities at each stage
  - Assign responsibility and authority for design and development activities
  - Define the traceability method — how outputs are traced back to inputs
  - Document required resources and personnel competencies
  category: standards
- id: OBL-13485-002
  title: Design Input Documentation
  source: ISO 13485:2016 §7.3.3
  section: 7.3.3 — Design and Development Inputs
  scope_flags:
  - common-baseline
  topic: requirements
  artifact_type: specification
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Design Inputs Record
  - Software Requirements Specification
  - User Needs Document
  verbatim: Are design inputs identified and documented, including the following?
    (a) Functional, performance and safety requirements; are usability requirements
    documented; are these requirements in accordance with the intended use? (b) Applicable
    regulatory requirements documented? (c) Applicable outputs for risk management
    processes? (d) Information from similar prior designs, as appropriate? (e) Any
    other essential requirements? Is there a record of the inputs being reviewed for
    adequacy and approved? How is it determined that the inputs are complete, not
    ambiguous, are not in conflict with each other and are able to be verified and
    validated?
  extracted_requirements:
  - Document design inputs covering: functional, performance, and safety requirements
  - Include usability requirements (IEC 62366-1) and verify they align with the intended
    use statement
  - Include applicable regulatory requirements (FDA guidance, applicable standards)
    as design inputs
  - Include risk management outputs as design inputs — risk controls become requirements
  - Reference information from similar prior designs (predicate device comparison)
  - Review and approve design inputs for adequacy, completeness, non-ambiguity, and
    non-conflict
  - Verify that each design input is verifiable or validatable (testable)
  category: standards
- id: OBL-13485-003
  title: Design Output Documentation
  source: ISO 13485:2016 §7.3.4
  section: 7.3.4 — Design and Development Outputs
  scope_flags:
  - common-baseline
  topic: design-outputs
  artifact_type: specification
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Design Outputs Record
  - Software Architecture Document
  - Software Design Document
  verbatim: Do the outputs (a) meet the input requirements? (b) Provide information
    for purchasing, production and service provision? (c) Reference or contain product
    acceptance criteria? (d) Specify the characteristics for safe and proper use of
    the product? Are records of the outputs maintained in a manner that is suitable
    for verification against the inputs? What evidence is there that outputs are approved
    before release?
  extracted_requirements:
  - Design outputs must demonstrably meet the design inputs — traceability is required
  - Outputs must provide sufficient information for production/service: build instructions,
      deployment specifications, configuration management records
  - Outputs must include or reference product acceptance criteria
  - Outputs must specify characteristics for safe and proper use (labeling-relevant
    outputs)
  - Outputs must be documented, verifiable against inputs, and approved before release
  category: standards
- id: OBL-13485-004
  title: Design Reviews
  source: ISO 13485:2016 §7.3.5
  section: 7.3.5 — Design and Development Review
  scope_flags:
  - common-baseline
  topic: design-reviews
  artifact_type: review-record
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Design Review Records
  - Phase Gate Records
  verbatim: Is there evidence of planned arrangements for design review stages? Do
    the arrangements (a) Evaluate the design and development process to meet the identified
    requirements? (b) Identify and propose necessary actions? Who participates in
    design reviews? Do they represent the functions concerned with the stage(s) being
    reviewed? Do specialists participate in the reviews? Are there records of the
    reviews that include the date(s) and participants? Are actions recorded? Do the
    records identify the design being reviewed?
  extracted_requirements:
  - Conduct design reviews at planned stages per the DDP
  - Each review must: evaluate design against requirements AND identify and record
      necessary actions
  - Review participants must represent all relevant functions for that stage (engineering,
    quality, regulatory, clinical)
  - Record the design review: date, participants, design version reviewed, findings,
      action items
  - Track action items to closure — the record must show disposition of all raised
    findings
  category: standards
- id: OBL-13485-005
  title: Design Verification Planning
  source: ISO 13485:2016 §7.3.6
  section: 7.3.6 — Design and Development Verification
  scope_flags:
  - common-baseline
  topic: verification
  artifact_type: test-report
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Verification Plan
  - Verification Reports
  - V&V Plan
  verbatim: 'Is there evidence of planned arrangements for design verification? Do
    the verification plans include: Methods, acceptance criteria, and, if appropriate,
    statistical justification for sampling? Does the device intended use require it
    to be interfaced with or connected to other devices? If so, does the verification
    confirm that the outputs still meet inputs when the device is connected or interfaced?
    Are there records of the verification results and conclusions? Are any necessary
    actions being recorded and maintained?'
  extracted_requirements:
  - Plan design verification at each development stage per the DDP
  - Verification plans must include: methods, acceptance criteria, and statistical
      justification for sampling where applicable
  - If the device interfaces with other devices (DICOM, PACS, C-arm), verify outputs
    meet inputs in the integrated configuration
  - Record verification results and conclusions — pass/fail against acceptance criteria
  - Record and track any necessary actions arising from verification failures
  category: standards
- id: OBL-13485-006
  title: Design Validation Planning
  source: ISO 13485:2016 §7.3.7
  section: 7.3.7 — Design and Development Validation
  scope_flags:
  - common-baseline
  topic: validation
  artifact_type: test-report
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Validation Plan
  - Clinical Validation Report
  - V&V Plan
  verbatim: 'Is there evidence of planned arrangements for design validation? Do the
    validation plans include: Methods, acceptance criteria, and, if appropriate, statistical
    justification for sampling? Has the validation been conducted on representative
    product? Are clinical evaluations and/or evaluation of performance performed with
    the new device as required by regulations? Was validation completed prior to product
    release for customer use? Are there records of the validation results and conclusions?'
  extracted_requirements:
  - Plan design validation per the DDP — plan must precede execution
  - Validation plans must include: methods, acceptance criteria, statistical justification
      for sampling
  - Validation must be conducted on representative product — production-equivalent
    hardware and software
  - Clinical evaluations or performance evaluations must be conducted as required
    by regulations (FDA 510(k) performance testing)
  - Validation must be completed and approved before product release to customers
  - Record validation results, conclusions, and any necessary actions
  category: standards
- id: OBL-13485-007
  title: Design Transfer Procedure
  source: ISO 13485:2016 §7.3.8
  section: 7.3.8 — Design and Development Transfer
  scope_flags:
  - common-baseline
  topic: configuration-change
  artifact_type: process-record
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Design Transfer Record
  - Release Package
  - Configuration Baseline
  verbatim: Are there documented procedures for design transfer? Are the results and
    conclusions of the transfer recorded?
  extracted_requirements:
  - Define and follow a documented design transfer procedure
  - Design transfer for SaMD = establishing the release baseline (software build,
    configuration, deployment specifications)
  - Record the results and conclusions of the design transfer — what was transferred,
    verified, and approved for release
  - Design transfer is a one-time per-version activity — subsequent changes go through
    the design change process (§7.3.9)
  category: standards
- id: OBL-13485-008
  title: Design Change Control
  source: ISO 13485:2016 §7.3.9
  section: 7.3.9 — Design and Development Changes
  scope_flags:
  - common-baseline
  topic: configuration-change
  artifact_type: change-record
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Design Change Records
  - PCCP Change Records
  - ECO Records
  verbatim: Are the changes reviewed, verified, validated (as appropriate) and approved
    prior to implementation? Are the changes evaluated for the effect on inputs or
    outputs of the risk management process? On the product realization process? On
    constituent parts and delivered products? Are the results of the review of changes
    and any necessary actions recorded?
  extracted_requirements:
  - Design changes must be reviewed, and as appropriate verified and validated, before
    implementation
  - Evaluate each change for impact on: risk management inputs/outputs, product realization
      process, constituent parts, and delivered/installed products
  - Record the change review, impact assessment, and approval
  - PCCP changes are design changes — they must follow this process, with the PCCP
    change control procedure defining the specific review/verification/validation
    required per change type
  category: standards
- id: OBL-13485-009
  title: Design History File
  source: ISO 13485:2016 §7.3.10
  section: 7.3.10 — Design and Development Files
  scope_flags:
  - common-baseline
  topic: traceability
  artifact_type: dhf-file
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Design History File
  - DHF README
  - DHF Manifest
  verbatim: 'Does the organization have a file for each type or family of devices?
    The file shall include or reference: records for design and development changes;
    records that demonstrate conformity to the design and development requirements.'
  extracted_requirements:
  - Maintain a Design History File (DHF) for each device type or family
  - The DHF must include or reference: all design change records; all records demonstrating
      conformity to design and development requirements
  - The DHF is an index/collection — it includes or references the artifacts, it is
    not itself all the artifacts
  - For the flat multi-DHF structure: the system DHF plus three item DHFs together
      constitute the DHF for the MedTech Project device family
  category: standards
- id: OBL-13485-010
  title: SOUP Supplier Qualification
  source: ISO 13485:2016 §7.4.1
  section: 7.4.1 — Purchasing Process
  scope_flags:
  - common-baseline
  topic: software-lifecycle
  artifact_type: process-record
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - SOUP List
  - Supplier Qualification Records
  - Approved Supplier List
  verbatim: This clause is intended to ensure supplier capability meets the organization's
    requirements. Are suppliers evaluated and selected based on their ability to supply
    product in accordance with organization's requirements? Are criteria for selection,
    evaluation and re-evaluation of suppliers documented? Are records of the evaluation
    results maintained?
  extracted_requirements:
  - Evaluate and qualify SOUP/third-party software components as suppliers (for IEC
    62304 Class B/C, SOUP evaluation is also an IEC 62304 §8.1.2 obligation)
  - Define criteria for SOUP selection, evaluation, and re-evaluation (vendor security
    posture, maintenance status, license compatibility)
  - Maintain records of SOUP evaluation — include: component name, version, supplier,
      evaluation date, qualification basis
  - Re-evaluate SOUP when new versions are adopted or when vulnerability information
    changes the risk profile
  category: standards
- id: OBL-14971-001
  title: Risk Management Plan
  source: ISO 14971:2019 §4.4
  section: §4.4 — Risk management plan
  scope_flags: []
  topic: risk-management
  artifact_type: plan
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Risk Management Plan
  verbatim: '"The manufacturer shall document a risk management plan for the device.

    The plan shall be part of the risk management file."

    '
  extracted_requirements:
  - Produce a Risk Management Plan before risk management activities begin
  - Plan must be part of the Risk Management File — not a standalone document
  - Plan must be maintained and updated throughout the device lifecycle
  category: standards
- id: OBL-14971-002
  title: RM Plan Content
  source: ISO 14971:2019 §4.4 (a)–(g)
  section: §4.4 — Risk management plan content
  scope_flags: []
  topic: risk-management
  artifact_type: plan
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Risk Management Plan
  verbatim: '"The risk management plan shall include at minimum: (a) the scope of
    the risk

    management activities; (b) assignment of responsibilities and authorities;

    (c) requirements for review of risk management activities; (d) criteria for

    risk acceptability, including the criteria used to decide when further risk

    reduction is required; (e) method for evaluating overall residual risk;

    (f) verification activities; (g) activities related to collection and review

    of production and post-production information."

    '
  extracted_requirements:
  - Define the scope — which device, which functions, which lifecycle phases
  - Assign responsibility and authority for risk management activities (named roles)
  - Define risk acceptability criteria — severity and probability scales, risk matrix,
    acceptable thresholds
  - Specify the method for evaluating overall residual risk (§8)
  - Identify planned verification activities linking risk controls to their evidence
  - Describe how post-production information will be collected and fed back into the
    risk file
  category: standards
- id: OBL-14971-003
  title: Risk Acceptability Criteria
  source: ISO 14971:2019 §4.4 — risk acceptability
  section: §4.4 — Risk acceptability criteria
  scope_flags: []
  topic: risk-management
  artifact_type: plan
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Risk Management Plan
  - Risk Management File
  verbatim: '"The manufacturer shall define the criteria for risk acceptability, including

    the criteria to be used to decide when further risk reduction is required and

    whether the residual risk is acceptable."

    '
  extracted_requirements:
  - Define severity levels (e.g., catastrophic, critical, marginal, negligible) with
    descriptions
  - Define probability levels with qualitative or quantitative definitions
  - Produce a risk matrix mapping severity × probability to risk levels (acceptable
    / ALARP / unacceptable)
  - State the criterion for when benefit-risk analysis is required (§7.4)
  category: standards
- id: OBL-14971-004
  title: Risk Management File
  source: ISO 14971:2019 §4.5
  section: §4.5 — Risk management file
  scope_flags: []
  topic: risk-management
  artifact_type: record
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Risk Management File
  verbatim: '"The manufacturer shall maintain a risk management file. For each hazard

    identified, the risk management file shall allow traceability to: the hazard,

    the hazardous situation(s), the estimated risk(s), the risk control measures,

    and the residual risk(s) after implementation of the controls."

    '
  extracted_requirements:
  - Maintain a Risk Management File — a collection of records providing full traceability
    for each hazard
  - 'Each hazard must be traceable through: hazardous situation → estimated risk →
    risk control → residual risk'
  - File must be structured to support audit — an auditor must be able to follow one
    hazard end-to-end
  category: standards
- id: OBL-14971-005
  title: Intended Use & Misuse
  source: ISO 14971:2019 §5.2
  section: §5.2 — Intended use and reasonably foreseeable misuse
  scope_flags: []
  topic: risk-management
  artifact_type: record
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Intended Use Statement
  - Risk Analysis
  - Risk Management Plan
  verbatim: '"The manufacturer shall document the intended use and the reasonably
    foreseeable

    misuse. The manufacturer shall identify the characteristics of the device that

    could affect safety, taking into account the intended use and reasonably

    foreseeable misuse."

    '
  extracted_requirements:
  - 'Document the intended use including: intended patient population, clinical indication,
    use environment, user profile'
  - Document reasonably foreseeable misuse scenarios — uses outside the intended use
    that are predictable
  - Both intended use and foreseeable misuse must feed the hazard identification process
    (§5.4)
  category: standards
- id: OBL-14971-006
  title: Safety Characteristics Identification
  source: ISO 14971:2019 §5.3
  section: §5.3 — Identification of characteristics related to safety
  scope_flags: []
  topic: risk-management
  artifact_type: record
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Risk Analysis
  - Safety-Related Characteristics Checklist
  verbatim: '"The manufacturer shall identify and document qualitative and quantitative

    characteristics of the device that could affect its safety, and where

    appropriate, define limits for these characteristics."

    '
  extracted_requirements:
  - Systematically identify device characteristics that could contribute to hazards
    (use ISO 14971 Annex C as a checklist)
  - For each safety-relevant characteristic, define acceptable limits or performance
    criteria where quantifiable
  - Document results as a record in the Risk Management File
  category: standards
- id: OBL-14971-007
  title: Hazard Identification
  source: ISO 14971:2019 §5.4
  section: §5.4 — Hazard identification
  scope_flags: []
  topic: risk-management
  artifact_type: record
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Preliminary Hazard Analysis
  - Hazard Analysis
  - Risk Management File
  verbatim: '"The manufacturer shall identify hazards and hazardous situations. For
    each

    identified hazardous situation, the manufacturer shall estimate the associated

    risk using available information or data."

    '
  extracted_requirements:
  - Identify all foreseeable hazards (energy, biology, data, software, mechanical,
    chemical, etc.)
  - For each hazard, trace the sequence of events to a hazardous situation (hazard
    → failure mode → hazardous situation → harm)
  - 'Consider hazards during all lifecycle phases: normal use, foreseeable misuse,
    maintenance, storage'
  - Document results in a Preliminary Hazard Analysis or equivalent hazard table in
    the Risk Management File
  category: standards
- id: OBL-14971-008
  title: Risk Estimation
  source: ISO 14971:2019 §5.5
  section: §5.5 — Risk estimation
  scope_flags: []
  topic: risk-management
  artifact_type: record
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Risk Assessment / FMEA
  - Risk Management File
  verbatim: '"For each identified hazardous situation, the manufacturer shall estimate
    the

    associated risk. The estimation shall consider the probability of occurrence of

    harm and the severity of that harm."

    '
  extracted_requirements:
  - Estimate risk for each hazardous situation using severity × probability from the
    risk matrix in the plan
  - Assign qualitative or quantitative values using the scales defined in the Risk
    Management Plan
  - Where probability cannot be estimated, list hazardous situations for risk evaluation
    without numerical estimation
  - Document risk estimations in the risk management file (e.g., FMEA table)
  category: standards
- id: OBL-14971-009
  title: Risk Evaluation
  source: ISO 14971:2019 §6
  section: §6 — Risk evaluation
  scope_flags: []
  topic: risk-management
  artifact_type: record
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Risk Assessment / FMEA
  - Risk Management File
  verbatim: '"The manufacturer shall evaluate each identified risk using the risk
    acceptability

    criteria in the risk management plan. This evaluation determines whether risk

    reduction is required."

    '
  extracted_requirements:
  - Apply the risk matrix from the plan to each estimated risk — classify as acceptable
    / ALARP / unacceptable
  - 'Document the evaluation decision: accept / reduce further / apply benefit-risk
    analysis'
  - If reduction is required, proceed to §7 risk control — do not accept an unacceptable
    risk without justification
  category: standards
- id: OBL-14971-010
  title: Risk Control Options
  source: ISO 14971:2019 §7.1
  section: §7.1 — Risk control option analysis
  scope_flags: []
  topic: risk-management
  artifact_type: record
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Risk Control Measures
  - Risk Management File
  verbatim: '"The manufacturer shall identify risk control measures, using one or
    more of the

    following, in priority order: (a) inherent safety by design; (b) protective

    measures in the device itself or manufacturing process; (c) information for

    safety."

    '
  extracted_requirements:
  - 'Apply risk controls in priority order: (1) design-level elimination, (2) device
    protective measure, (3) information/labeling'
  - Document the rationale for selecting the chosen control type — explain why higher-priority
    options were not applicable when skipped
  - 'For software: design-level controls include defensive coding, input validation,
    output limits, redundancy; labeling-only for a software-induced hazard is rarely
    sufficient at Class C'
  category: standards
- id: OBL-14971-011
  title: Risk Control Verification
  source: ISO 14971:2019 §7.2 + §7.3
  section: §7.2 — Risk control implementation; §7.3 — Residual risk evaluation
  scope_flags: []
  topic: risk-management
  artifact_type: record
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Risk Control Measures
  - Verification Records
  - Risk Management File
  verbatim: '"The manufacturer shall implement the risk control measures and verify
    their

    implementation. After implementation, the manufacturer shall evaluate the

    residual risk."

    '
  extracted_requirements:
  - Verify that each risk control measure is implemented as specified (implementation
    verification record)
  - Evaluate residual risk after controls — re-estimate severity × probability with
    controls in place
  - If residual risk remains unacceptable, apply additional controls or proceed to
    §7.4 benefit-risk analysis
  - Link each risk control to its V&V evidence in the Risk Management File
  category: standards
- id: OBL-14971-012
  title: Benefit-Risk Analysis
  source: ISO 14971:2019 §7.4
  section: §7.4 — Benefit-risk analysis
  scope_flags: []
  topic: risk-management
  artifact_type: record
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Benefit-Risk Analysis
  - Risk Management File
  verbatim: '"If the residual risk is not acceptable, the manufacturer shall use the
    criteria

    defined in the risk management plan to determine whether the medical benefit

    of the intended use outweighs the residual risk."

    '
  extracted_requirements:
  - Conduct a benefit-risk analysis for any hazardous situation where residual risk
    exceeds acceptability criteria after all feasible controls are applied
  - 'Document the benefit argument: what clinical benefit does the device provide,
    and why does it outweigh this specific residual risk'
  - If benefit does not outweigh risk, the device cannot be released — the risk must
    be made acceptable first
  category: standards
- id: OBL-14971-013
  title: Secondary Hazard Evaluation
  source: ISO 14971:2019 §7.5 + §7.6
  section: §7.5 — Risks from controls; §7.6 — Completeness of risk control
  scope_flags: []
  topic: risk-management
  artifact_type: record
  dhf_owner: both
  min_iec62304_class: A
  applies_to:
  - Risk Management File
  verbatim: '"The manufacturer shall evaluate whether the risk control measures introduce

    new hazards or hazardous situations. The manufacturer shall verify that all

    identified hazardous situations have been considered."

    '
  extracted_requirements:
  - After applying each risk control, evaluate whether the control creates new hazards
    (secondary hazards)
  - If new hazards are created, apply the full risk process to them
  - 'Complete a completeness check: verify that every hazardous situation identified
    in §5 has a documented risk control outcome'
  category: standards
- id: OBL-14971-014
  title: Overall Residual Risk Evaluation
  source: ISO 14971:2019 §8
  section: §8 — Evaluation of overall residual risk
  scope_flags: []
  topic: risk-management
  artifact_type: record
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Overall Residual Risk Evaluation
  - Risk Management Report
  verbatim: '"After all risk control measures have been implemented, the manufacturer
    shall

    evaluate the overall residual risk of the device using the criteria established

    in the risk management plan. If the overall residual risk is not acceptable,

    the manufacturer shall gather and review information to determine whether the

    medical benefit outweighs the overall residual risk."

    '
  extracted_requirements:
  - Conduct an Overall Residual Risk Evaluation (ORRE) after all individual risk controls
    are verified
  - ORRE considers the cumulative effect of all residual risks — not just individual
    hazardous situation risks
  - 'Document the ORRE conclusion: overall residual risk acceptable / requires benefit-risk
    analysis'
  - If overall benefit-risk analysis is required, document it formally (not embedded
    in the ORRE)
  category: standards
- id: OBL-14971-015
  title: Risk Management Review
  source: ISO 14971:2019 §9
  section: §9 — Risk management review
  scope_flags: []
  topic: risk-management
  artifact_type: report
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Risk Management Report
  verbatim: '"Before commercial distribution, the manufacturer shall review the risk
    management

    process to ensure: the risk management plan has been implemented; the overall

    residual risk is acceptable; appropriate methods are in place to obtain relevant

    information in the post-production phase."

    '
  extracted_requirements:
  - Conduct a Risk Management Review before product release — this is a pre-release
    gate
  - 'Review must confirm: (1) the plan was followed, (2) ORRE is acceptable, (3) post-production
    monitoring is in place'
  - Document the review outcome in a Risk Management Report
  - Risk Management Report must be signed by responsible management and included in
    the Risk Management File
  category: standards
- id: OBL-14971-016
  title: Post-Production Risk Feedback
  source: ISO 14971:2019 §10
  section: §10 — Production and post-production activities
  scope_flags:
  - pccp
  topic: post-market
  artifact_type: plan
  dhf_owner: system
  min_iec62304_class: A
  applies_to:
  - Post-Market Surveillance Plan
  - Risk Management Plan
  verbatim: '"The manufacturer shall establish a system to collect and review information

    generated during production and post-production phases. If previously unrecognized

    hazards or risks that are no longer acceptable are identified, the manufacturer

    shall feed this information back into the risk management process."

    '
  extracted_requirements:
  - 'Establish a Post-Market Surveillance (PMS) system that collects: complaints,
    adverse event reports, field feedback, publicly available information about similar
    devices'
  - Review PMS data on a defined cadence against the risk management file
  - If new hazards or newly unacceptable risks are identified, formally feed back
    into the risk management process
  - 'For PCCP: post-market data from each change iteration must feed back into risk
    evaluation before the next change is authorized'
  category: standards
