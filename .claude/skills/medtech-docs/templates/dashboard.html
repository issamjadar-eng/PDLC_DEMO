<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PROJECT_NAME}} — Documentation Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; }
  .dashboard { max-width: 1200px; margin: 0 auto; }
  .header { margin-bottom: 2rem; }
  .header h1 { font-size: 1.5rem; color: #f8fafc; }
  .header .subtitle { color: #94a3b8; font-size: 0.875rem; margin-top: 0.25rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1.5rem; }
  .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
  .card h2 { font-size: 1rem; color: #f8fafc; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
  .progress-bar { background: #334155; border-radius: 0.5rem; height: 0.5rem; margin-bottom: 1rem; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 0.5rem; transition: width 0.3s; }
  .progress-fill.green { background: #22c55e; }
  .progress-fill.yellow { background: #eab308; }
  .progress-fill.red { background: #ef4444; }
  .progress-fill.gray { background: #475569; }
  .section-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid #334155; font-size: 0.875rem; }
  .section-row:last-child { border-bottom: none; }
  .section-name { color: #cbd5e1; }
  .section-status { display: flex; align-items: center; gap: 0.5rem; }
  .badge { padding: 0.125rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600; }
  .badge.complete { background: #166534; color: #bbf7d0; }
  .badge.partial { background: #854d0e; color: #fef08a; }
  .badge.empty { background: #374151; color: #9ca3af; }
  .badge.count { background: #1e3a5f; color: #93c5fd; }
  .standards-table { width: 100%; margin-top: 1rem; font-size: 0.8rem; }
  .standards-table th { text-align: left; color: #94a3b8; padding: 0.5rem 0; border-bottom: 1px solid #334155; }
  .standards-table td { padding: 0.5rem 0; border-bottom: 1px solid #1e293b; }
  .check-passed { color: #22c55e; }
  .check-failed { color: #ef4444; }
  .check-pending { color: #94a3b8; }
  .timestamp { text-align: center; color: #475569; font-size: 0.75rem; margin-top: 2rem; }
</style>
</head>
<body>
<div class="dashboard">
  <div class="header">
    <h1>{{PROJECT_NAME}}</h1>
    <div class="subtitle">Documentation Dashboard — Generated {{TIMESTAMP}}</div>
  </div>
  <div class="grid">
    <!-- EXTERNAL REFERENCES CARD -->
    <div class="card">
      <h2>External References</h2>
      <div class="progress-bar"><div class="progress-fill {{EXT_COLOR}}" style="width: {{EXT_PCT}}%"></div></div>
      <!-- One section-row per subfolder with file count and status badge -->
    </div>

    <!-- DESIGN CONTROLS CARD -->
    <div class="card">
      <h2>Design Controls</h2>
      <div class="progress-bar"><div class="progress-fill {{DC_COLOR}}" style="width: {{DC_PCT}}%"></div></div>
      <!-- One section-row per subfolder -->
    </div>

    <!-- INPUT ANALYSIS CARD -->
    <div class="card">
      <h2>Input Analysis</h2>
      <div class="progress-bar"><div class="progress-fill {{IA_COLOR}}" style="width: {{IA_PCT}}%"></div></div>
      <!-- One section-row per subfolder -->
    </div>

    <!-- SUBMISSIONS CARD -->
    <div class="card">
      <h2>Submissions</h2>
      <div class="progress-bar"><div class="progress-fill {{SUB_COLOR}}" style="width: {{SUB_PCT}}%"></div></div>
      <!-- One section-row per subfolder -->
    </div>

    <!-- STANDARDS COMPLIANCE CARD (full width) -->
    <div class="card" style="grid-column: 1 / -1;">
      <h2>Standards Compliance</h2>
      <table class="standards-table">
        <thead>
          <tr><th>Standard</th><th>Passed</th><th>Pending</th><th>Failed</th><th>N/A</th><th>Coverage</th></tr>
        </thead>
        <tbody>
          <!-- One row per standard file with verification checks -->
        </tbody>
      </table>
    </div>
  </div>
  <div class="timestamp">Generated by /medtech-docs dashboard — {{TIMESTAMP}}</div>
</div>
</body>
</html>
