# Workbench validation manifest — consumed by the workbench-validation skill.
# Authored source of truth for user needs + test cases. The report and sidecar are
# generated projections; edit here, then re-run `/workbench-validation validate`.
schema_version: "2.0"

# Stamped at the top of every generated report (demo projects: keep the demo banner).
banner: "_Demo sample data — not for clinical use._"

# Authored sources live in docs/; GENERATED outputs (results, evidence logs,
# report, sidecar) live under tools/workbench-validation/.
plan: docs/project/workbench-validation/validation-plan.md
results_dir: tools/workbench-validation/results
sidecar: tools/workbench-validation/workbench-validation-index.json
report:
  title: "Workbench Validation Report — <MedTech Project>"
  output: tools/workbench-validation/validation-report.md

# Verdicts are PASS / FAIL / NOT-APPLICABLE only. A need with no applicable
# executed case FAILS ("no evidence"). Method and scope live on the test case.
#
# Deployment declaration — what THIS instance has. `scope: deployment` cases
# name their dependencies in `requires_deployment:` (dotted keys); a key
# declared absent makes the case NOT-APPLICABLE with that justification.
# `endpoint: live` cases resolve `connection:` against deployment.connections.
deployment:
  connections:
    jira: none          # or: configured (base_url read from project.yml change_control.jira)
    confluence: none
    browser: none
  content:
    qms_forms: false    # FORM-* templates registered under docs/internal/source-md/
    taxonomy: false     # .taxonomy.yml with governing_qms mappings
    controlled_mirror: false
    submission_package: false
    commercial_corpus: false
    knowledge_packs: false
    jira_mirror: false
    file_locator_index: false
    task_docs: true

# Protocol / inspection execution records: <protocol_results_dir>/<TC-ID>.result.yml
# (schema: templates/protocol-result.yml). Absent record → NOT-EXECUTED (fails the need).
protocol_results_dir: tools/workbench-validation/protocols

# QMS template coverage inventory (optional): a deployment case writes this JSON
# (contract: templates[] with instances/tested/pass/fail/status, procedures[],
# documents_without_template[], summary{}); the report/sidecar/console render it
# so newly imported QMS templates — or doctypes with none — stay visible.
qms_coverage: tools/workbench-validation/qms-coverage.json

# Triaged anomalies carried into the report's Known Anomalies section. Each
# entry names an owner and the run by which it is expected to clear.
known_anomalies: []

# Optional override of the default revalidation-trigger list.
# revalidation_triggers: []

# Each need is a USER STORY composed by the renderer from three fields:
#   "As a {role}, I need the workbench to {need}, so that {so_that}."
# `need` = the outcome the role can observe, phrased to follow "I need the
# workbench to…" (no mechanism, no "As a…" prefix); `so_that` = the purpose —
# required. The mechanism lives in `implemented_by:` (traceability only). The
# runner refuses a need missing role / need / so_that.
user_needs:
  - id: WUN-01
    role: "<role, e.g. Program lead>"
    class: gates            # authoring|audit|gates|renderers|console|config-control|cross-cutting
    tier: T1                # T1|T2|T3
    need: "<outcome the role can observe — follows 'I need the workbench to'>"
    so_that: "<purpose — why the role needs it>"
    implemented_by: "<mechanism — traceability only>"
  - id: WUN-02
    role: "<role, e.g. Reviewer / approver>"
    class: authoring
    tier: T1
    need: "<outcome that is the assistant's judgment — tested by a protocol case>"
    so_that: "<purpose>"
    implemented_by: "<mechanism>"

test_cases:
  - id: TC-01
    title: "<plain-language: what is being checked, in everyday words>"
    description: "<what the case checks and why it matters — for a non-specialist reviewer>"
    approach: "<how the check works, plainly>"
    wun: [WUN-01]           # the only need<->test mapping edge
    uut: [<skill-name>]     # unit(s) under test — component(s) the case runs against;
                            # multiple allowed; skill names get pinned to the version
                            # exercised; `all-skills` = workbench-wide sweep
    scope: capability       # capability (skill fixtures, portable) | deployment (this instance)
    method: scripted        # scripted | protocol | inspection
    # requires_deployment: [content.qms_forms]   # deployment cases: dotted keys into `deployment:`
    endpoint: none          # none | mocked | live — REQUIRED. What the case touched:
                            # nothing external / a fake transport with canned payloads /
                            # a real endpoint (then also set `connection:`)
    # connection: jira      # for endpoint: live — key into deployment.connections
  - id: TC-02
    title: "<judgment need tested by protocol>"
    description: "<what the protocol establishes>"
    approach: "<challenge set + acceptance criteria, executed by an operator with the agent>"
    wun: [WUN-02]
    uut: [<skill-name>]
    scope: deployment
    method: protocol
    endpoint: none
    protocol: docs/project/workbench-validation/protocols/TC-02.md   # from templates/protocol.md
    # result: <protocol_results_dir>/TC-02.result.yml — absent → NOT-EXECUTED
    cmd: ["bash", ".claude/skills/<skill>/tests/<test>.sh"]
    # cwd: .
    # timeout: 600
    # requires: [uv]                    # missing binary -> SKIPPED
    # env_unset: [CLAUDE_SESSION_ID]    # strip session state leaking into gate tests
    # env: {KEY: value}
    # pass_pattern: "ALL TESTS PASSED"  # for suites that exit 0 regardless
    # fail_pattern: "FAILED"            # overrides exit 0
