<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram — Lifecycle / state machine</title>
<style>
  :root{--bg:#f6f8fb;--ink:#1a2330;--muted:#5b6573;--line:#d9dee6;--navy:#28384f;
    --c1:#1b7f4b;--c1b:#e6f6ec;--c2:#1f5fa6;--c2b:#e6f0fa;--c3:#9a3412;--c3b:#fdece2;--c4:#6b21a8;--c4b:#f3e9fb}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);margin:0;padding:28px;line-height:1.5}
  .pnote{background:#fff8e6;border:1px solid #f0dca0;border-radius:8px;padding:10px 14px;margin:0 0 18px;font-size:.82rem;color:#6b5618}
  figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 1px 3px rgba(20,30,48,.06)}
  figure svg{width:100%;height:auto;display:block}
  figcaption{font-size:.82rem;color:var(--muted);margin-top:10px;text-align:center}
  svg text{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
</head>
<body>
<div class="pnote">Standalone preview of the <code>diagram-lifecycle</code> snippet. The CSS here is <strong>preview-only</strong> — canonical styles live in <code>../../templates/explainer.html</code>. To use this visual, copy only the markup between the SNIPPET markers. For <em>when</em> to use which visual, see the selection table in <code>../../SKILL.md</code>.</div>
<!-- BEGIN SNIPPET: diagram-lifecycle -->
<figure>
  <svg viewBox="0 0 1000 250" role="img" aria-label="{{what this lifecycle shows}}">
    <defs>
      <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b6573"/></marker>
    </defs>
    <!-- three states in a row + a transition label on each arrow, plus a loop-back -->
    <rect x="40" y="90" width="220" height="60" rx="30" fill="#e6f0fa" stroke="#1f5fa6"/>
    <text x="150" y="126" text-anchor="middle" font-size="13" font-weight="700">{{State 1}}</text>

    <line x1="260" y1="120" x2="382" y2="120" stroke="#5b6573" stroke-width="2" marker-end="url(#arr)"/>
    <text x="321" y="110" text-anchor="middle" font-size="10.5" fill="#44505f">{{transition}}</text>

    <rect x="384" y="90" width="220" height="60" rx="30" fill="#e6f6ec" stroke="#1b7f4b"/>
    <text x="494" y="126" text-anchor="middle" font-size="13" font-weight="700">{{State 2}}</text>

    <line x1="604" y1="120" x2="726" y2="120" stroke="#5b6573" stroke-width="2" marker-end="url(#arr)"/>
    <text x="665" y="110" text-anchor="middle" font-size="10.5" fill="#44505f">{{transition}}</text>

    <rect x="728" y="90" width="232" height="60" rx="30" fill="#f3e9fb" stroke="#6b21a8"/>
    <text x="844" y="126" text-anchor="middle" font-size="13" font-weight="700">{{State 3 (final)}}</text>

    <!-- optional loop-back transition -->
    <path d="M494,150 L494,200 L150,200 L150,152" fill="none" stroke="#9a3412" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <text x="322" y="218" text-anchor="middle" font-size="10.5" fill="#9a3412">{{optional back-transition}}</text>
  </svg>
  <figcaption>{{Caption — the states and what moves an item from one to the next.}}</figcaption>
</figure>
<!-- END SNIPPET -->
</body>
</html>
