<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram — Decision flow</title>
<style>
  :root{--bg:#f6f8fb;--ink:#1a2330;--muted:#5b6573;--line:#d9dee6;--navy:#28384f;
    --c1:#1b7f4b;--c1b:#e6f6ec;--c2:#1f5fa6;--c2b:#e6f0fa;--c3:#9a3412;--c3b:#fdece2;--c4:#6b21a8;--c4b:#f3e9fb}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);margin:0;padding:28px;line-height:1.5}
  .pnote{background:#fff8e6;border:1px solid #f0dca0;border-radius:8px;padding:10px 14px;margin:0 0 18px;font-size:.82rem;color:#6b5618}
  figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 1px 3px rgba(20,30,48,.06)}
  figure svg{width:100%;height:auto;display:block}
  figcaption{font-size:.82rem;color:var(--muted);margin-top:10px;text-align:center}
  svg text{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
</head>

<div class="pnote">Standalone preview of the <code>diagram-decision-flow</code> snippet. The CSS here is <strong>preview-only</strong> — canonical styles live in <code>../../templates/explainer.html</code>. To use this visual, copy only the markup between the SNIPPET markers. For <em>when</em> to use which visual, see the selection table in <code>../../SKILL.md</code>.</div>

<figure>
  <svg viewBox="0 0 1000 270" role="img" aria-label="{{what this decision shows}}">
    <defs>
      <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b6573"/></marker>
    </defs>
    <!-- input -->
    <rect x="400" y="14" width="200" height="46" rx="8" fill="#e6f0fa" stroke="#1f5fa6"/>
    <text x="500" y="42" text-anchor="middle" font-size="13" font-weight="700">{{Input / trigger}}</text>
    <line x1="500" y1="60" x2="500" y2="86" stroke="#5b6573" stroke-width="2" marker-end="url(#arr)"/>
    <!-- decision diamond -->
    <polygon points="500,90 620,150 500,210 380,150" fill="#fff8e6" stroke="#9a3412"/>
    <text x="500" y="146" text-anchor="middle" font-size="12.5" font-weight="700">{{Question?}}</text>
    <text x="500" y="164" text-anchor="middle" font-size="10" fill="#44505f">{{the test}}</text>
    <!-- yes branch -->
    <line x1="620" y1="150" x2="772" y2="150" stroke="#5b6573" stroke-width="2" marker-end="url(#arr)"/>
    <text x="690" y="140" text-anchor="middle" font-size="11" fill="#1b7f4b" font-weight="700">yes</text>
    <rect x="774" y="124" width="212" height="52" rx="8" fill="#e6f6ec" stroke="#1b7f4b"/>
    <text x="880" y="154" text-anchor="middle" font-size="12.5" font-weight="700">{{Outcome A}}</text>
    <!-- no branch -->
    <line x1="380" y1="150" x2="228" y2="150" stroke="#5b6573" stroke-width="2" marker-end="url(#arr)"/>
    <text x="310" y="140" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="700">no</text>
    <rect x="14" y="124" width="212" height="52" rx="8" fill="#fdece2" stroke="#9a3412"/>
    <text x="120" y="154" text-anchor="middle" font-size="12.5" font-weight="700">{{Outcome B}}</text>
  </svg>
  <figcaption>{{Caption — what is being decided and what each branch leads to.}}</figcaption>
</figure>
