<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Diagram — 2×2 matrix / quadrant</title>
<style>
  :root{--bg:#f6f8fb;--ink:#1a2330;--muted:#5b6573;--line:#d9dee6;--navy:#28384f;
    --c1:#1b7f4b;--c1b:#e6f6ec;--c2:#1f5fa6;--c2b:#e6f0fa;--c3:#9a3412;--c3b:#fdece2;--c4:#6b21a8;--c4b:#f3e9fb}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);margin:0;padding:28px;line-height:1.5}
  .pnote{background:#fff8e6;border:1px solid #f0dca0;border-radius:8px;padding:10px 14px;margin:0 0 18px;font-size:.82rem;color:#6b5618}
  figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 1px 3px rgba(20,30,48,.06)}
  figure svg{width:100%;height:auto;display:block}
  figcaption{font-size:.82rem;color:var(--muted);margin-top:10px;text-align:center}
  svg text{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

<figure>

    <rect x="120" y="40" width="400" height="160" fill="#e6f0fa"/>

    <text x="320" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">{{Quadrant TL}}</text>
    <text x="720" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1b7f4b">{{Quadrant TR}}</text>

    <text x="520" y="392" text-anchor="middle" font-size="12" font-weight="700">{{X axis →  (low … high)}}</text>
