<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram — Sequence / handshake</title>
<style>
  :root{--bg:#f6f8fb;--ink:#1a2330;--muted:#5b6573;--line:#d9dee6;--navy:#28384f;
    --c1:#1b7f4b;--c1b:#e6f6ec;--c2:#1f5fa6;--c2b:#e6f0fa;--c3:#9a3412;--c3b:#fdece2;--c4:#6b21a8;--c4b:#f3e9fb}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);margin:0;padding:28px;line-height:1.5}
  .pnote{background:#fff8e6;border:1px solid #f0dca0;border-radius:8px;padding:10px 14px;margin:0 0 18px;font-size:.82rem;color:#6b5618}
  figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 1px 3px rgba(20,30,48,.06)}
  figure svg{width:100%;height:auto;display:block}
  figcaption{font-size:.82rem;color:var(--muted);margin-top:10px;text-align:center}
  svg text{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
</head>
<body>
<div class="pnote">Standalone preview of the <code>diagram-sequence-handshake</code> snippet. The CSS here is <strong>preview-only</strong> — canonical styles live in <code>../../templates/explainer.html</code>. To use this visual, copy only the markup between the SNIPPET markers. For <em>when</em> to use which visual, see the selection table in <code>../../SKILL.md</code>.</div>
<!-- BEGIN SNIPPET: diagram-sequence-handshake -->
<figure>
  <svg viewBox="0 0 1000 300" role="img" aria-label="{{what this exchange shows}}">
    <defs>
      <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b6573"/></marker>
    </defs>
    <!-- actor headers -->
    <rect x="60" y="14" width="240" height="40" rx="8" fill="#e6f0fa" stroke="#1f5fa6"/>
    <text x="180" y="39" text-anchor="middle" font-size="12.5" font-weight="700">{{Actor A}}</text>
    <rect x="700" y="14" width="240" height="40" rx="8" fill="#e6f6ec" stroke="#1b7f4b"/>
    <text x="820" y="39" text-anchor="middle" font-size="12.5" font-weight="700">{{Actor B}}</text>
    <!-- lifelines -->
    <line x1="180" y1="54" x2="180" y2="286" stroke="#c7cfdb" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="820" y1="54" x2="820" y2="286" stroke="#c7cfdb" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- messages -->
    <line x1="180" y1="90" x2="816" y2="90" stroke="#5b6573" stroke-width="2" marker-end="url(#arr)"/>
    <text x="500" y="82" text-anchor="middle" font-size="11" fill="#44505f">{{1 · request →}}</text>
    <line x1="820" y1="140" x2="184" y2="140" stroke="#5b6573" stroke-width="2" marker-end="url(#arr)"/>
    <text x="500" y="132" text-anchor="middle" font-size="11" fill="#44505f">{{2 · ← response}}</text>
    <line x1="180" y1="190" x2="816" y2="190" stroke="#5b6573" stroke-width="2" marker-end="url(#arr)"/>
    <text x="500" y="182" text-anchor="middle" font-size="11" fill="#44505f">{{3 · confirm →}}</text>
    <!-- optional boundary -->
    <line x1="500" y1="60" x2="500" y2="286" stroke="#9a3412" stroke-width="1.5" stroke-dasharray="2 5"/>
    <text x="500" y="276" text-anchor="middle" font-size="9.5" fill="#9a3412">{{optional boundary, e.g. session / network}}</text>
  </svg>
  <figcaption>{{Caption — who exchanges what, in order.}}</figcaption>
</figure>
<!-- END SNIPPET -->
</body>
</html>
