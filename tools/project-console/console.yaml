# tools/project-console/console.yaml
# Project-local configuration. Safe to edit.

theme: globallogic

grounding:
  # Extra filesystem roots exposable to the assistant drawer's grounding
  # surface AND browsable in the documents tree. The defaults
  # (docs/project, docs/external, docs/internal/source-md) are always
  # included. Paths below add skill-embedded distilled standards + FDA
  # guidance and the dhf-manifest data folder so deep-links into manifest
  # tier files (e.g. tier1-regulatory/<name>.md) resolve in the explorer.
  extra_roots:
    - .claude/skills/medtech-docs/references
    - .claude/skills/dhf-manifest/data

models:
  default: claude-sonnet-4-6
  # summarizer: claude-haiku-4-5   # used by catalog build in /assistant
  # Per-model source + grounding caps (optional — code defaults apply if absent).
  # Raise these if you have context-window room and want the assistant to
  # ingest more grounding per request.
  # caps:
  #   claude-sonnet-4-6: {source_cap_kb: 500, grounding_cap_kb: 80}
  #   claude-opus-4-7:   {source_cap_kb: 2000, grounding_cap_kb: 200}
  #   claude-haiku-4-5:  {source_cap_kb: 300, grounding_cap_kb: 80}

dashboards:
  patterns:
    - docs/**/*-tracker.html
    - docs/**/*-dashboard.html
    - docs/**/dashboard.html
    - docs/**/*-tree.html
  overrides:
    submission-tracker:
      title: "Submission Package Tracker"
      description: "510(k) submission package readiness across base submission, PCCP, and supporting engineering artifacts."
      group: "Submissions"
      order: 1

server:
  host: 127.0.0.1
  port: 8765
  log_level: info

auth:
  callback_url: null
