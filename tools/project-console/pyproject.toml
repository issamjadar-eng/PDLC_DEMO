[project]
name = "project-console"
version = "0.1.0"
description = "Local web UI for the PDLC_DEMO project — dashboards, domain agents, workflows."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.9",
    "markdown>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["console"]
