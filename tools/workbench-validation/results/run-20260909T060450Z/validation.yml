    method: scripted
    endpoint: none
    cmd: ["uv", "run", "--no-project", "--with", "pytest", "--", "pytest", ".claude/skills/task/tests", "-q"]
    requires: [uv]
  - id: TC-39
    title: "A frozen controlled document cannot be edited from inside the workbench"
    description: "Feeds the PreToolUse freeze hook an edit on a document whose lifecycle state is frozen (or released) and expects a deny with a briefing, plus a silent allow for an unfrozen document, a non-markdown file, and an unrelated tool. The hook fails open on an unparseable payload."
    approach: "Runs the change-control tests marked freeze_gate."
    wun: [WUN-29]
    uut: [change-control]
    scope: capability
    method: scripted
    endpoint: none
    cmd: ["uv", "run", "--no-project", "--with", "pytest", "--with", "pyyaml", "--", "pytest", ".claude/skills/change-control/tests", "-q", "-m", "freeze_gate"]
    requires: [uv]
  - id: TC-40
    title: "Assistant spend is attributed to the active task and unmeasured slots read as unknown"
    description: "Checks the aggregation step of the cost telemetry: spend lands on the task that was active at the time, an unmeasured slot is null rather than zero, and aggregating twice is byte-identical."
    approach: "Runs the usage-metrics pytest suite over synthetic per-session records and an activation ledger."
    wun: [WUN-23]
    uut: [usage-metrics]
    scope: capability
    method: scripted
    endpoint: none
    cmd: ["uv", "run", "--no-project", "--with", "pytest", "--", "pytest", ".claude/skills/usage-metrics/tests", "-q"]
    requires: [uv]
  - id: TC-41
    title: "Advisor grounding and search stay on canonical sources (fixture)"
    description: "Checks the grounding scanner itself: an agent whose GROUNDING block cites canonical paths passes; one citing an audience explainer, a personal work folder or an exported pack fails."
    approach: "Runs the advisors grounding-scan pytest suite over fixture agents."
    wun: [WUN-25]
    uut: [advisors]
    scope: capability
    method: scripted
    endpoint: none
    cmd: ["uv", "run", "--no-project", "--with", "pytest", "--with", "pyyaml", "--", "pytest", ".claude/skills/advisors/tests/test_grounding_scan.py", "-q"]
    requires: [uv]
  - id: TC-42
    title: "This project's advisors and search index reference only canonical sources"
    description: "DEPLOYMENT check: every installed advisor's GROUNDING block and every row of the semantic search index reference canonical sources only — never audience explainers, personal work folders or exported packs."
    approach: "Runs grounding_scan.py over .claude/agents and the file-locator index with --json; passes only on exit 0."
