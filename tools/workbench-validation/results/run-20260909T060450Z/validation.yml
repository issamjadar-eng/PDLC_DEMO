  - id: TC-43
    title: "Every imported QMS template that project documents instantiate has validation evidence"
    description: "DEPLOYMENT check and inventory: joins the imported QMS registry with the form-conformance results. Passes when the inventory generates and every template that project documents instantiate was exercised by the conformance check; the inventory itself lists unused templates and doctypes with no imported template so the gaps stay visible."
    approach: "Runs qms_coverage.py, which runs the conformance checker over the DHF trees and writes the coverage JSON the report and console render; exit 0 only when no instantiated template lacks evidence."
    wun: [WUN-30, WUN-01]
    uut: [medtech-docs]
