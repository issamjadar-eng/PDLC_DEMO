  # ---- Report revisions + export package (task ben/124) ----
  - id: TC-45
    title: "Every recorded run has its own rendered report, sidecar and index row"
    description: "DEPLOYMENT check: the runs index lists every recorded run with a verdict, and each run folder carries its own rendered report and sidecar so the console can show any revision."
    approach: "Reads results/index.json and checks every run-*.json has an index row whose sidecar and report files exist and whose sidecar revision block names that run."
    wun: [WUN-32]
    uut: [workbench-validation]
    scope: deployment
    method: scripted
    endpoint: none
    cmd: ["python3", "-c", "import json,glob,sys;from pathlib import Path;R=Path('tools/workbench-validation/results');idx={r['run_id']:r for r in json.load(open(R/'index.json'))};runs=[json.load(open(f))['run_id'] for f in glob.glob(str(R/'run-*.json'))];bad=[r for r in runs if r not in idx or not idx[r]['sidecar'] or not idx[r]['report'] or not Path(idx[r]['sidecar']).is_file() or not Path(idx[r]['report']).is_file() or json.load(open(idx[r]['sidecar']))['revision']['run_id']!=r];print('runs',len(runs),'indexed',len(idx),'bad',bad);sys.exit(1 if bad or not runs else 0)"]
    timeout: 60
  - id: TC-46
    title: "The validation package exports as Markdown, Word and PDF with every evidence section present"
    description: "DEPLOYMENT check: exports the latest run as a sectioned package in all three formats through the project's sanctioned document pipeline, and checks the Markdown carries the cover, sign-off block and appendices A–F."
    approach: "Runs export_package.py for the latest run in md, docx and pdf; passes only when all three files exist and the Markdown contains every required section."
    wun: [WUN-31]
    uut: [workbench-validation, docflow]
    scope: deployment
    method: scripted
    endpoint: none
    requires: [pandoc, soffice]
    cmd: ["bash", "-c", "set -e; S=.claude/skills/workbench-validation/scripts/export_package.py; MD=$(python3 $S --root . --run latest --format md | tail -1); DOCX=$(python3 $S --root . --run latest --format docx | tail -1); PDF=$(python3 $S --root . --run latest --format pdf | tail -1); test -s \"$MD\" && test -s \"$DOCX\" && test -s \"$PDF\"; for h in 'Sign-off' 'Appendix A' 'Appendix B' 'Appendix C' 'Appendix D' 'Appendix E' 'Appendix F'; do grep -q \"$h\" \"$MD\" || { echo \"missing section: $h\"; exit 1; }; done; echo EXPORT-OK $MD $DOCX $PDF"]
    pass_pattern: "EXPORT-OK"
    timeout: 600
