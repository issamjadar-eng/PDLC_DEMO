    approach: "Runs the secops session-hook pytest suite over temp fixture projects."
    wun: [WUN-22, WUN-12]
    uut: [secops]
    scope: capability
    method: scripted
    endpoint: none
    cmd: ["uv", "run", "--no-project", "--with", "pytest", "--", "pytest", ".claude/skills/secops/tests/test_session_hooks.py", "-q"]
    requires: [uv, jq, git]
  - id: TC-38
    title: "An interrupted task is surfaced at the next session start"
    description: "Checks the checkpoint-recovery hook: a planted uncheckpointed-task marker is surfaced; without one the hook stays quiet."
    approach: "Runs the task skill's pytest suite over a temp fixture project."
    wun: [WUN-22]
    uut: [task]
