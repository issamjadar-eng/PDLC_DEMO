    timeout: 300
  - id: TC-44
    title: "The 510(k) eSTAR package passes the admissibility and coverage gate"
    description: "DEPLOYMENT check: runs the eSTAR linter over the 510(k) crosswalk (structured answers, applicable sections, attachment coverage, no unresolved [VERIFY]). Not applicable until the package has an eSTAR crosswalk — declared absent here rather than claimed by a structure-only pass."
    approach: "Runs estar_lint.py --transmit-gate --json with the package's crosswalk; passes only on exit 0."
