    implemented_by: "medtech-docs scaffolding + .taxonomy.yml doctype governance + regulatory-authoring workflow"
    process_controls:
      - "doctype-governance rule: governing FORM/SOP/WI read before editing any taxonomy-governed doc"
      - "regulatory-authoring 3-stage check (lint + copy-editor + QA-conformance) on substantive edits"
      - "Mandatory human review before formal publish (change-control review tiers)"
  - id: WUN-02
