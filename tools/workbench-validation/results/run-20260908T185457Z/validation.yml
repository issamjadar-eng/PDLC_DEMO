    approach: "Sweeps every installed skill and verifies a version declaration exists in its metadata or VERSION file; lists any tool that has none."
    wun: [WUN-13]
    # Bundled external skills (Anthropic office suite) are version-exempt, mirroring
    # the best-practices "Skills are versioned" check's external-skill exemption.
    cmd: ["python3", "-c", "import re,sys;from pathlib import Path;EXEMPT={'docx','pdf','pptx','xlsx'};missing=[d.name for d in sorted(Path('.claude/skills').iterdir()) if d.is_dir() and d.name not in EXEMPT and (d/'SKILL.md').is_file() and not (re.search(r'^version:\\s*\\S+',(lambda t:t[3:t.find(chr(10)+'---',3)] if t.startswith('---') and t.find(chr(10)+'---',3)!=-1 else '')((d/'SKILL.md').read_text(errors='replace')),re.M) or (d/'VERSION').is_file())];print('missing version:',missing) if missing else print('all skills versioned (external office skills exempt)');sys.exit(1 if missing else 0)"]
    timeout: 60

