# `title` / `description` / `approach` are written for a NON-SPECIALIST reviewer:
# title = what is being checked in everyday words; description = what the case
# checks and why it matters; approach = how the check works, plainly. The old
# technical framing lives on in the cmd itself and the evidence logs.
# `uut:` names the unit(s) under test — the workbench component(s) the case
# actually runs against (usually skill names; multiple allowed). The runner pins
# each named skill to the version exercised (`uut_versions`) in results, logs,
# report, and sidecar. Sentinel value `all-skills` = a workbench-wide sweep.
test_cases:
  - id: TC-01
    uut: [task]
    endpoint: none
    title: "The 'no work without a task' gate blocks and allows the right files"
    description: "Checks the safeguard that stops project files from being changed when no work task is active. Protected files must be blocked; everyday exempt files (task notes, settings) must still be allowed."
    approach: "Runs the gate's own 63-scenario self-test in a clean environment: it simulates edit attempts with and without an active task and compares every block/allow decision against the expected one. Passes only when the suite reports all scenarios passed."
    wun: [WUN-07]
    cmd: ["bash", ".claude/skills/task/tests/test-task-gate.sh"]
    env_unset: [CLAUDE_SESSION_ID]
    pass_pattern: "ALL TESTS PASSED"
    timeout: 300
    requires: [jq]
  - id: TC-02
    uut: [docflow]
    endpoint: none
    title: "The document-conversion gate stops uncontrolled conversions"
    description: "Checks the safeguard that prevents documents from being converted outside the controlled pipeline (which preserves images, structure, and traceability)."
    approach: "Feeds the gate two simulated commands: a direct document conversion (must be refused) and a harmless file listing (must be permitted), then verifies both decisions came back exactly as required."
    wun: [WUN-08]
    cmd: ["bash", "-c", "export CLAUDE_PROJECT_DIR=\"$PWD\"; H=.claude/skills/docflow/hooks/block-direct-conversion.sh; if [ -f .state/docflow-active ]; then echo 'bypass marker present - gate cannot be exercised'; exit 1; fi; printf '%s' '{\"tool_input\":{\"command\":\"pandoc report.docx -o report.md\"}}' | bash \"$H\" 2>/dev/null; d=$?; printf '%s' '{\"tool_input\":{\"command\":\"ls docs\"}}' | bash \"$H\" 2>/dev/null; a=$?; echo \"deny_exit=$d allow_exit=$a\"; [ \"$d\" -eq 2 ] && [ \"$a\" -eq 0 ]"]
    timeout: 60
    requires: [jq, python3]
  - id: TC-03
    uut: [medtech-docs]
    endpoint: none
    title: "Auto-generated document sections stay faithful and do no harm"
    description: "Checks the machinery that fills in auto-generated tables and trees inside project documents: generated content must always match the source of truth, and text written by hand around it must never be touched."
    approach: "Runs the generator's regression suite: it renders known inputs repeatedly and verifies the output is identical every time (idempotent), preserves hand-written content, and refuses unsafe targets."
    wun: [WUN-09]
    cmd: ["uv", "run", "--no-project", "--with", "pytest", "--with", "pyyaml", "--", "pytest", ".claude/skills/medtech-docs/tests", "-q"]
    timeout: 600
    requires: [uv]
  - id: TC-04
    uut: [advisors]
    endpoint: none
    title: "Advisor grounding files are built correctly"
    description: "Checks the machinery that prepares each AI advisor's reading list (the project documents it grounds its answers in), so advisors always cite from the right sources."
    approach: "Runs the advisor tooling's regression suite: it builds grounding blocks from known configurations and verifies the generated lists, file wiring, and search integration match the expected output."
    wun: [WUN-09, WUN-25]
    cmd: ["uv", "run", "--no-project", "--with", "pytest", "--with", "pyyaml", "--", "pytest", ".claude/skills/advisors/tests", "-q"]
    timeout: 600
    requires: [uv]
  - id: TC-05
    uut: [writing-well]
    endpoint: none
    title: "Writing-quality checks catch known defects"
    description: "Checks the automatic proof-reading tools that flag clutter, jargon, hedging, and AI-sounding text before a document goes to review."
    approach: "Runs the lint engines against fixture texts with known, planted defects and verifies each defect is detected and clean text is not flagged."
    wun: [WUN-04]
    cmd: ["bash", ".claude/skills/writing-well/tests/run_tests.sh"]
    timeout: 600
  - id: TC-06
    uut: [dhf-manifest]
    endpoint: none
    title: "The document-coverage audit finds what's missing"
    description: "Checks the audit that compares the project's document set against the catalog of documents regulations require, so gaps are found by us and not by an auditor."
    approach: "Runs the audit machinery's 48-scenario self-test: it builds document sets with known gaps and verifies each gap (and each satisfied obligation) is reported correctly."
    wun: [WUN-06]
    cmd: ["bash", ".claude/skills/dhf-manifest/tests/test_discovery_index.sh"]
    timeout: 600
  - id: TC-07
    uut: [trace-matrix]
    endpoint: none
    title: "Traceability-chain checks work"
    description: "Checks the tooling that verifies every requirement traces forward to design and tests and backward to user needs — the chain auditors walk."
    approach: "Runs the trace tooling's regression suite: known trace graphs with deliberate breaks are analyzed and the tool must find every break and confirm intact chains in both directions."
    wun: [WUN-27]
    cmd: ["uv", "run", "--no-project", "--with", "pytest", "--with", "pyyaml", "--", "pytest", ".claude/skills/trace-matrix/tests", "-q"]
    timeout: 600
    requires: [uv]
  - id: TC-08
