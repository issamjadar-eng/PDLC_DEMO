# Workbench validation manifest — PDLC_DEMO AI workbench.
# Authored source of truth (paired with validation-plan.md). The report, results,
# and sidecar are generated projections; edit here, then run
# `/workbench-validation validate`.
schema_version: "1.2"

banner: "_Demo sample data — not for clinical use._ Illustrative of method only — not a regulatory claim; [VERIFY]-flagged clauses unchecked against licensed source text."

# Authored sources live here in docs/; GENERATED outputs (results, evidence
# logs, report, sidecar) live under tools/workbench-validation/ — same pattern
# as tools/usage-metrics (generated tool output, not authored documentation).
plan: docs/project/workbench-validation/validation-plan.md
results_dir: tools/workbench-validation/results
sidecar: tools/workbench-validation/workbench-validation-index.json
report:
  title: "Workbench Validation Report — PDLC_DEMO AI Workbench"
  output: tools/workbench-validation/validation-report.md

# Evidence tiers (D7). Every test case declares `endpoint: none | mocked | live`.
# `connections:` states what THIS deployment has for each external system. A
# `live` case whose `connection:` is declared `none` here is reported
# NOT-APPLICABLE (a statement about the deployment, never a gap) and does not
# lower any verdict. A connection declared present but unreachable is a real
# SKIP/FAIL. This project connects to none of them; it validates the
# integration code against mocked transports and records live probes only.
connections:
  jira: none          # change_control.jira.base_url unset in project.yml
  confluence: none    # no change_control.spaces[] in project.yml
  browser: none       # no debug Chrome (web-control cookie bridge) in this deployment

known_anomalies:
  # Each entry names an owner and the run by which it is expected to clear —
  # an anomaly without those is parked, not dispositioned (task ben/119 D1).
  - "**Designed-but-inert control** — `change-control/hooks/pre_tool_use_frozen.py` is a stub (exits 0): the frozen-controlled-doc edit block is designed but not yet enforcing; lifecycle-state enforcement currently relies on process discipline. Owner: change-control skill maintainer. Expected to clear: the run after the hook is implemented and a gate case (TC) is added for it."
  - "**Untested deterministic checkers** — several load-bearing lint/checker scripts have no regression suite pinning their behavior (regulatory-authoring `authoring_lint.py`, submissions linters — TC-25 exercises only the positive path on the live package, no synthetic inconsistent fixture yet — commercial `dossier_lint.py`, docflow fidelity gates, gap-analysis sidecar renderer). WUN-04 evidence rests on the writing-well lint suite only. Owner: each skill's maintainer. Expected to clear: one case per checker added as suites land; the secops scanner (TC-19) and the validation tooling itself (TC-26) closed their instances of this gap in 2026-09."
  - "**Commercial data snapshots stale (project content finding, 2026-09-08)** — `commercial.py check` reports every approved edition's `internal-fleet` / `internal-upgrade-campaign` pins as STALE (43 days against a 7-day window) with no waiver, and `corpus.py check` fails. The gate is doing its job; the finding is about the data, not the tool, which is why WUN-19 is process-control rather than a scripted case that would flip with snapshot age. Owner: commercial workstream (business-domains task). Expected to clear: on the next corpus refresh or a recorded waiver."
  - "**Suite exit-code masking** — the task-gate suite reports per-scenario failures but exits 0 regardless; pass/fail is derived from its output banner (`pass_pattern`). Owner: task skill maintainer. Expected to clear: the run after the suite exits non-zero on any failed scenario."
  - "**Environment sensitivity** — the task-gate suite requires `CLAUDE_SESSION_ID` to be unset (a live agent session's ID makes fake-session DENY scenarios resolve ALLOW); the runner strips it via `env_unset` and records it in the environment record's isolation block. Accepted residual: documented, mechanically enforced by the manifest."
  - "**Model identifier depends on the operator** — the harness does not export the model to scripts; the runner records it only when passed via `--model-id` (or `$CLAUDE_MODEL`) and otherwise reports 'not captured' as a run warning. Owner: validation operator (record at run time). Accepted residual until the harness exposes it."
  - "**Live-endpoint cases are NOT-APPLICABLE here by declaration** — `connections:` declares jira / confluence / browser as `none`; TC-17/18/21 therefore never execute in this deployment and WUN-16 is exploratory. Not a gap for this project; a deployment with a connection flips the declaration and the same cases run live."

# Revalidation triggers — when the recorded environment must be re-established.
revalidation_triggers:
  - "Skill / agent / hook / rule file change (any `.claude/` diff since the recorded commit) — re-run the affected cases, full run before a run of record"
  - "Underlying model or harness version change (environment record: `model_id`, `harness_version`) — full run + exploratory review of Tier-1 LLM paths"
  - "Tooling change (environment record: any `tooling.*.version` or resolved `python_packages` differs) — full run"
  - "Connection declaration change (`connections:` flips between `none` and present, or a declared endpoint's reachability changes) — run the affected `live` cases and update WUN-16's probe record"
  - "project.yml security / config change — re-run posture and gate cases"
  - "Intended-use change (new action, new output destination) — revisit the need register"
  - "Periodic: per internal-audit cycle"

# Each need is a user story composed by the renderer from three fields:
#   "As a {role}, I need the workbench to {need}, so that {so_that}."
# `need` is the outcome the role can observe (phrased to follow "I need the
# workbench to…"), never how the workbench implements it; `so_that` is the
# purpose — required. The mechanism lives in `implemented_by:` (traceability
# only, not part of the need). The runner refuses a need missing any of the three.
