  # ---- Register scrub additions 2026-09 (task ben/120) ----
  - id: TC-22
    title: "Internal notes cannot survive into a published external document"
    description: "Checks the publish step that produces the public copy of a white paper or article: internal evidence blocks and draft metadata must be removed, and a document with a malformed internal block must be refused rather than published."
    approach: "Builds two small documents in a temp folder — one well-formed with an internal block, one with an unclosed block — runs the strip script on each, and checks the public output carries no internal text or marker and that the malformed one is refused with the documented exit code."
    wun: [WUN-17]
    uut: [public-doc]
    endpoint: none
    cmd: ["bash", "-c", "set -e; T=$(mktemp -d); printf -- '---\npublic_doc:\n  audience: x\n---\n# T\n\nPublic line.\n\n<!-- INTERNAL:BEGIN -->\nsecret\n<!-- INTERNAL:END -->\n' > \"$T/d.md\"; python3 .claude/skills/public-doc/scripts/strip_internal.py \"$T/d.md\" -o \"$T/out.md\" --quiet; grep -q 'Public line' \"$T/out.md\"; ! grep -qE 'secret|INTERNAL|public_doc' \"$T/out.md\"; printf -- '# T\n<!-- INTERNAL:BEGIN -->\nopen\n' > \"$T/bad.md\"; set +e; python3 .claude/skills/public-doc/scripts/strip_internal.py \"$T/bad.md\" -o \"$T/o2.md\" --quiet; rc=$?; set -e; [ \"$rc\" -eq 3 ]; echo STRIP-OK"]
    pass_pattern: "STRIP-OK"
    timeout: 60
