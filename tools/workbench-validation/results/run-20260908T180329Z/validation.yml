# Workbench validation manifest — PDLC_DEMO AI workbench.
# Authored source of truth (paired with validation-plan.md). The report, results,
# and sidecar are generated projections; edit here, then run
# `/workbench-validation validate`.
schema_version: "1.1"

banner: "_Demo sample data — not for clinical use._ Illustrative of method only — not a regulatory claim; [VERIFY]-flagged clauses unchecked against licensed source text."

# Authored sources live here in docs/; GENERATED outputs (results, evidence
# logs, report, sidecar) live under tools/workbench-validation/ — same pattern
# as tools/usage-metrics (generated tool output, not authored documentation).
plan: docs/project/workbench-validation/validation-plan.md
results_dir: tools/workbench-validation/results
sidecar: tools/workbench-validation/workbench-validation-index.json
report:
  title: "Workbench Validation Report — PDLC_DEMO AI Workbench"
  output: tools/workbench-validation/validation-report.md

# Evidence tiers (D7). Every test case declares `endpoint: none | mocked | live`.
# `connections:` states what THIS deployment has for each external system. A
# `live` case whose `connection:` is declared `none` here is reported
# NOT-APPLICABLE (a statement about the deployment, never a gap) and does not
# lower any verdict. A connection declared present but unreachable is a real
# SKIP/FAIL. This project connects to none of them; it validates the
# integration code against mocked transports and records live probes only.
connections:
  jira: none          # change_control.jira.base_url unset in project.yml
  confluence: none    # no change_control.spaces[] in project.yml
  browser: none       # no debug Chrome (web-control cookie bridge) in this deployment

known_anomalies:
  # Each entry names an owner and the run by which it is expected to clear —
  # an anomaly without those is parked, not dispositioned (task ben/119 D1).
  - "**Designed-but-inert control** — `change-control/hooks/pre_tool_use_frozen.py` is a stub (exits 0): the frozen-controlled-doc edit block is designed but not yet enforcing; lifecycle-state enforcement currently relies on process discipline. Owner: change-control skill maintainer. Expected to clear: the run after the hook is implemented and a gate case (TC) is added for it."
  - "**Untested deterministic checkers** — several load-bearing lint/checker scripts have no regression suite pinning their behavior (regulatory-authoring `authoring_lint.py`, submissions linters, commercial `dossier_lint.py`, gap-analysis sidecar renderer). WUN-04 evidence rests on the writing-well lint suite only. Owner: each skill's maintainer. Expected to clear: one case per checker added as suites land; the secops scanner closed its own instance of this gap in 2026-09 (TC-19)."
  - "**Suite exit-code masking** — the task-gate suite reports per-scenario failures but exits 0 regardless; pass/fail is derived from its output banner (`pass_pattern`). Owner: task skill maintainer. Expected to clear: the run after the suite exits non-zero on any failed scenario."
  - "**Environment sensitivity** — the task-gate suite requires `CLAUDE_SESSION_ID` to be unset (a live agent session's ID makes fake-session DENY scenarios resolve ALLOW); the runner strips it via `env_unset` and records it in the environment record's isolation block. Accepted residual: documented, mechanically enforced by the manifest."
  - "**Model identifier depends on the operator** — the harness does not export the model to scripts; the runner records it only when passed via `--model-id` (or `$CLAUDE_MODEL`) and otherwise reports 'not captured' as a run warning. Owner: validation operator (record at run time). Accepted residual until the harness exposes it."
  - "**Live-endpoint cases are NOT-APPLICABLE here by declaration** — `connections:` declares jira / confluence / browser as `none`; TC-17/18/21 therefore never execute in this deployment and WUN-16 is exploratory. Not a gap for this project; a deployment with a connection flips the declaration and the same cases run live."

# Revalidation triggers — when the recorded environment must be re-established.
revalidation_triggers:
  - "Skill / agent / hook / rule file change (any `.claude/` diff since the recorded commit) — re-run the affected cases, full run before a run of record"
  - "Underlying model or harness version change (environment record: `model_id`, `harness_version`) — full run + exploratory review of Tier-1 LLM paths"
  - "Tooling change (environment record: any `tooling.*.version` or resolved `python_packages` differs) — full run"
  - "Connection declaration change (`connections:` flips between `none` and present, or a declared endpoint's reachability changes) — run the affected `live` cases and update WUN-16's probe record"
  - "project.yml security / config change — re-run posture and gate cases"
  - "Intended-use change (new action, new output destination) — revisit the need register"
  - "Periodic: per internal-audit cycle"

# Each need is stated from a ROLE's perspective, in the role's own language —
# what outcome they need, never how the workbench implements it. The mechanism
# lives in `implemented_by:` (informational traceability, not part of the need).
user_needs:
  - id: WUN-01
    role: "DHF author"
    class: authoring
    tier: T1
    need: "When I draft a controlled document, its structure must come out matching what the governing QMS form requires — without me having to remember the form's rules."
    coverage: process-control
    implemented_by: "medtech-docs scaffolding + .taxonomy.yml doctype governance + regulatory-authoring workflow"
    process_controls:
      - "doctype-governance rule: governing FORM/SOP/WI read before editing any taxonomy-governed doc"
      - "regulatory-authoring 3-stage check (lint + copy-editor + QA-conformance) on substantive edits"
      - "Mandatory human review before formal publish (change-control review tiers)"
  - id: WUN-02
    role: "Reviewer / approver"
    class: authoring
    tier: T1
    need: "I can always tell which content in a controlled document came from the AI assistant and which content a human wrote or approved."
    coverage: process-control
    implemented_by: "AI-changelog metadata blocks + working-vs-formal document split + PR history"
    process_controls:
      - "ai-changelog rule: non-published AI-CHANGELOG metadata block on every AI-assisted controlled-doc edit"
      - "Working-markdown vs formal/ split per design-controls conventions"
      - "git/PR audit trail (PR-then-auto-merge workflow)"
  - id: WUN-03
    role: "Regulatory affairs lead"
    class: authoring
    tier: T1
    need: "If the toolchain could not verify a claim it drafted, that claim is visibly flagged for me — never silently asserted as fact."
    coverage: process-control
    implemented_by: "[VERIFY] flag convention + no-fabrication policy + mandatory reference audit on citation-bearing edits"
    process_controls:
      - "No-fabrication policy + [VERIFY] convention (CLAUDE.md operating notes)"
      - "reference-audit final-stage todo required for citation-bearing edits (regulatory-authoring rule §6)"
  - id: WUN-04
    role: "DHF author"
    class: authoring
    tier: T1
    need: "Before my document goes out for review, mechanical writing defects (leaks, jargon, clutter, undefined terms) are caught automatically and reliably."
    coverage: tests
    implemented_by: "writing-well + regulatory-authoring deterministic lint scripts"
  - id: WUN-05
    role: "Quality engineer"
    class: audit
    tier: T2
    need: "When a document cites a standard, guidance, or internal source, I get a trustworthy answer on whether the citation really matches the source text."
    coverage: exploratory
    implemented_by: "reference-audit skill + citations advisor (LLM-driven verification against byte-correct sources)"
    process_controls:
      - "Reference-audit runs are independent subagent passes; findings reports persisted under docs/_analysis/ with per-citation evidence for human spot-check"
  - id: WUN-06
    role: "Quality engineer"
    class: audit
    tier: T2
    need: "If our documentation drifts from its declared structure, traceability, or tracker baseline, I find out from our own audit run — not from an external auditor."
    coverage: tests
    implemented_by: "dhf-manifest coverage audit + trace-matrix graph checks + tracker validation + jira-pull drift rules"
  - id: WUN-07
    role: "Program lead"
    class: gates
    tier: T1
    need: "No project file gets changed without being anchored to a tracked task, so every change is traceable to why it was made."
    coverage: tests
    implemented_by: "task-gate PreToolUse hook (check-active-task.sh) with exempt-path list"
  - id: WUN-08
    role: "Quality engineer"
    class: gates
    tier: T1
    need: "Documents cannot be converted outside the controlled conversion pipeline without a deliberate, visible override."
    coverage: tests
    implemented_by: "docflow conversion-block PreToolUse hook with .state/docflow-active override marker"
  - id: WUN-09
    role: "DHF author"
    class: renderers
    tier: T1
    need: "Auto-generated sections of my documents always reflect the current source of truth, and never damage the text I wrote by hand around them."
    coverage: tests
    implemented_by: "sentinel-block renderer (render-sentinels.py) + advisor grounding renderer, both idempotent"
  - id: WUN-10
    role: "Program lead"
    class: console
    tier: T3
    need: "Dashboards and decks show me the real, current state of the project — and tell me when what I'm looking at is stale."
    coverage: tests
