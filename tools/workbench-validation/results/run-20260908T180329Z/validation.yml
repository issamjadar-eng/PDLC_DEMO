    uut: [change-control]
    endpoint: live
    connection: jira
    cmd: ["uv", "run", "--no-project", "--with", "pytest", "--with", "pyyaml", "--", "pytest", ".claude/skills/change-control/tests", "-q", "-m", "live", "--live"]
