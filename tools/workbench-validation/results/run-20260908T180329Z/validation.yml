  - id: TC-20
    title: "Browser-bridge helper logic is correct without a browser"
    description: "Checks the pure-logic parts of the shared browser-automation library (cookie header assembly, URL/config parsing) that the document-transfer machinery reuses — hermetically, with no browser running."
    approach: "Runs the web-control unit suite under the socket guard; anything that would need a browser is a separate live case (TC-21)."
    wun: [WUN-15]
    uut: [web-control]
    endpoint: none
    cmd: ["uv", "run", "--no-project", "--with", "pytest", "--", "pytest", ".claude/skills/web-control/tests", "-q"]
    requires: [uv]
    timeout: 300
  - id: TC-21
    title: "Browser bridge reaches a signed-in browser (only where one is running)"
    description: "Runs the web-control live smoke test against a debug browser session. NOT-APPLICABLE here by declaration (no debug browser in this deployment)."
    approach: "Runs only the `live`-marked web-control tests with the `--live` opt-in."
    wun: [WUN-15, WUN-16]
    uut: [web-control]
    endpoint: live
    connection: browser
    cmd: ["uv", "run", "--no-project", "--with", "pytest", "--", "pytest", ".claude/skills/web-control/tests", "-q", "-m", "live", "--live"]
    requires: [uv]
    timeout: 300
