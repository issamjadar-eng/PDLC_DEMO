  - id: TC-18
    title: "Jira mirror refresh works against the real Jira (only where one is connected)"
    description: "Runs the jira-pull live smoke test against the deployment's real Jira. NOT-APPLICABLE here by declaration (no Jira connection)."
    approach: "Runs only the `live`-marked jira-pull tests with the `--live` opt-in."
    wun: [WUN-06, WUN-16]
    uut: [jira-pull]
    endpoint: live
    connection: jira
    cmd: ["uv", "run", "--no-project", "--with", "pytest", "--with", "pyyaml", "--with", "openpyxl", "--", "pytest", ".claude/skills/jira-pull/tests", "-q", "-m", "live", "--live"]
    requires: [uv]
    timeout: 600
  - id: TC-19
    title: "The security scanner itself still catches real hostile patterns"
    description: "Checks that the security screen's rules fire on genuine config-tamper and remote-execution patterns and stay quiet on comments, docstrings, heredoc help text, and temp-path fixtures — so a clean TC-15 result means 'nothing hostile', not 'the scanner went blind'."
    approach: "Runs the scanner's regression suite over synthetic fixture trees with known-positive and known-negative content, including the exit-code contract."
    wun: [WUN-12]
    uut: [secops]
    endpoint: none
    cmd: ["uv", "run", "--no-project", "--with", "pytest", "--", "pytest", ".claude/skills/secops/tests", "-q"]
    requires: [uv]
