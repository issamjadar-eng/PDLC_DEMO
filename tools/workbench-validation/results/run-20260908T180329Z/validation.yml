  - id: WUN-11
    role: "Team member"
    class: config-control
    tier: T2
    need: "When I sync shared tooling, my local improvements are never silently overwritten, and I can see at a glance whether I'm in step with the team."
    coverage: tests
    implemented_by: "sync-skills three-way merge analysis (LOCAL_AHEAD protection) + status action"
  - id: WUN-12
    role: "Security officer"
    class: config-control
    tier: T2
    need: "Any tool added to the workbench is screened for hostile behavior, and unapproved tools cannot operate unnoticed."
    coverage: tests
