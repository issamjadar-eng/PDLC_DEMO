  - id: 1.3
    title: Key deliverables
    anchor: L33-L36
    rhetorical_move: Enumeration — the four artifact streams that make up the program output.
    primary_takeaway: Four artifact streams (Q-Sub, 510(k), PCCP, trace matrix) operationalize the filing scope and the Ct* gating.
    key_facts:
      - Q-Sub package covers cover letter, device description, classification, PCCP scope questions
      - 510(k) submission carries SE argument, IEC 62304 enhanced documentation, V&V data, risk analysis, labeling
      - PCCP covers three change categories with modification protocols and post-market reporting
      - Trace matrix has Filing Scope and PAM-or-pump columns derived from Ct* tags
    metaphor_candidates:
      - Four pillars of the submission
      - Four lanes feeding one finish line
    contrast_pairs:
      - Pre-submission (Q-Sub) vs submission (510(k))
      - Static document (510(k)) vs living envelope (PCCP)
    callbacks: [1.2, 3.2]
    audience_alignment: Reassures regulatory leads and PM that artifacts map cleanly to the scope.
