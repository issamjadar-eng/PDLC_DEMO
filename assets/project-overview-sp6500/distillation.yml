  - id: 4.1
    title: Where the handoff actually happens
    anchor: L88-L95
    rhetorical_move: Boundary drawing — names the explicit human and agent stages in DHF authoring.
    primary_takeaway: The handoff is documented, audited, and hook-enforced — humans own briefs, clinical acceptability, and SE approval; agents own structural authoring, KOL summarization, and protocol drafting.
    key_facts:
      - Human PM drafts task brief and success criteria
      - Agent skill executes structural authoring, templates, scaffolds, trace links
      - Human clinical reviews each dose-related design input
      - Agent clinical-affairs generates KOL feedback summaries from digital twins
      - Human regulatory approves SE argumentation before submission
      - Agent vnv-lead drafts V&V protocol from design inputs and risk file
    metaphor_candidates:
      - A relay where each runner knows exactly when the baton drops
      - Tide line between human judgment and agent execution
    contrast_pairs:
      - Human judgment stage vs agent execution stage
      - Structural authoring (agent) vs clinical acceptability (human)
    callbacks: [2.1, 2.2, 4.2]
    audience_alignment: Settles executive concern about AI overreach by showing the audited boundary.
    tone: clear, accountable
    warnings:
      - Boundary is enforced by session hooks; do not present as advisory only.
    data:
      kind: ladder
      title: Human-AI handoff stages in DHF authoring
      series:
        - { label: 'Human PM — task brief and success criteria', accent: 'orange' }
        - { label: 'Agent skill — structural authoring', accent: 'amber' }
        - { label: 'Human clinical — dose input review', accent: 'orange' }
        - { label: 'Agent clinical-affairs — KOL summary', accent: 'amber' }
