  - id: 3.2
    title: Quality system anchors
    anchor: L81-L84
    rhetorical_move: Standards anchoring — pins the QMS evidence chain to four authorities.
    primary_takeaway: ISO 13485, IEC 62304 enhanced, ISO 14971, and 21 CFR 820 form the four-pillar QMS evidence chain, with risk treated as a first-class trace-matrix column rather than an afterthought.
    key_facts:
      - ISO 13485 governs design controls input → output → V&V → risk
      - IEC 62304 enhanced documentation triggered by Class C SaMD classification (PAM)
      - ISO 14971 risk file is a first-class trace column
      - 21 CFR 820 carries the QMS evidence chain through design transfer and post-market
    metaphor_candidates:
      - A four-leg stool — pull one and the chain collapses
      - Risk as a load-bearing column, not a panel insert
    contrast_pairs:
      - Risk as first-class column vs risk as appendix
      - Design transfer cutoff vs continuous post-market chain
    callbacks: [1.3, 3.1]
    audience_alignment: Reassures auditors and regulatory leads the QMS spine is intact.
    tone: structured, normative
    warnings: []
