  - id: 3.1
    title: Hazard register summary
    anchor: L72-L79
    rhetorical_move: Risk enumeration — names the six load-bearing hazards and their controls.
    primary_takeaway: Six high-priority hazards drive the V&V scope; each has documented residual-risk acceptance after layered controls combining mechanical, firmware, and procedural mitigations.
    key_facts:
      - Free flow on disconnect — anti-free-flow valve plus active flow detection
      - Drug library mismatch — dual-witness deployment plus runtime concentration cross-check
      - Alarm fatigue masking critical events — PAM 38% nuisance-alarm reduction
      - Battery depletion — 30-minute reserve plus escalating warnings starting at 60 minutes
      - Pump tampering during transport — mechanical key-lock plus firmware audit trail
      - Dose calculation regression — IEC 62304 enhanced docs plus automated regression suite plus telemetry
    metaphor_candidates:
      - Six fault lines, six reinforced bridges
      - Defense in depth, hazard by hazard
    contrast_pairs:
      - Passive control (mechanical valve) vs active control (firmware detection)
      - Pre-deployment control (dual-witness) vs runtime control (cross-check)
    callbacks: [1.1, 1.2, 3.2]
    audience_alignment: Gives risk and regulatory leads the spine of the V&V scope.
    tone: rigorous, layered
    warnings:
      - Note PAM is the alarm-fatigue control but is filed separately, not in SP6500 510(k).
