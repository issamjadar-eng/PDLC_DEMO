  document_title: SP6500 Smart Pump Program Overview
  document_kind: program-overview

executive_summary: |
  SP6500 is a large-volume single-channel IV infusion pump filed as a 510(k) traditional submission against the SP6000 predicate (K200111), bundling pump hardware, firmware, and the Drug Library Manager under one filing with an integrated PCCP. The Predictive Alarm Module is deliberately carved out to a separate later filing to protect the SP6500 timeline. The program runs as a cross-functional pod backed by a network of KOL digital-twin advisors and four investigator sites, with a documented human-AI handoff pattern that delivered equivalent IEC 62304 documentation in 38% of SP6000's calendar time and reduced clinical-correctness defects by 21%. The next 90 days lock the predicate-comparison table, file the Q-Sub, and open formative HF testing.

executive_takeaways:
  - Filing scope is tight on purpose — SP6500 pump plus DLM only; PAM and MDDS components are excluded to keep the timeline.
  - PCCP is the substantive delta — pre-authorizing drug-library, firmware, and dose-error tuning changes against fixed acceptance criteria.
  - Critical-to-Safety/Function/Performance tagging is the gating mechanism — only Ct* requirements are in scope for 510(k); commercial features ride the marketing track.
  - The agentic console measured a real productivity delta — 38% calendar time and 21% fewer clinical defects — by automating structure, not judgment.
  - Risk file is a first-class column in the trace matrix, integrated end-to-end, not bolted on after V&V.
  - KOL voice is operationalized as digital-twin personas that any task can call, not a periodic human review.

key_concepts:
  - name: PCCP envelope
    definition: Predetermined Change Control Plan pre-authorizing three categories of bounded post-clearance modifications.
  - name: Critical-requirement carve-out
    definition: CtS / CtF / CtP tagging scheme that gates which user needs and design inputs land in the 510(k) versus ship post-clearance.
  - name: PAM filing posture
    definition: Predictive Alarm Module filed separately six months later against AlarmGuard predicate to avoid extending SP6500 by an estimated 9 months.
  - name: Digital-twin KOL advisors
    definition: Eight callable persona agents with curated corpora and review criteria, embedded in authoring tasks.
  - name: Human-AI handoff pattern
    definition: Documented and hook-enforced boundary between human judgment stages and agent execution stages in DHF authoring.
  - name: Closed-loop disambiguation
    definition: SP6500's closed loop is the internal flow-rate controller, not clinician-out-of-the-loop dosing.

audience:
  inferred: true
  primary_named: Steering committee (16-slide pitch in 2 weeks)
  personas:
    - role: Steering committee executive
      lens: Wants timeline confidence, scope discipline, and competitive differentiation in one frame.
      cares_about: Filing date, predicate strength, PCCP leverage, productivity story.
    - role: Regulatory and clinical leads
      lens: Need to verify that scope carve-outs and predicate logic hold up to FDA scrutiny.
      cares_about: Substantial-equivalence argument, PAM separation rationale, Ct* tagging traceability.
    - role: Cross-functional engineering pod
      lens: Implementing day-to-day under the handoff pattern and trace-matrix discipline.
      cares_about: Where their work lands in scope, how the agentic tooling changes their cadence, hazard-control coverage.

unifying_theme:
  metaphor: A surgical incision rather than a sweeping cut — the program succeeds by cutting precisely where scope ends, not by enlarging the field.
  big_idea: |
    SP6500 is a discipline story. The program wins not by doing more but by carving the filing scope, the predicate envelope, and the human-AI boundary into clear, defensible lines — and letting the agentic tooling accelerate everything inside those lines.
  confidence: 0.72

guardrails:
  language:
    - Always mark fabricated content with the demo banner; never imply real DHF evidence.
    - Use 'closed-loop' only for the internal flow controller; never for dosing autonomy.
    - Refer to PAM as out-of-scope-this-filing, not cancelled or descoped.
  framing:
    - Lead with scope discipline, not feature count.
    - Treat the 38% time and 21% defect numbers as benchtop / program metrics, not clinical claims.
    - Cite SP6000 K200111 as the predicate by name where substantial equivalence is asserted.
  forbidden:
    - Do not describe SP6500 as multi-channel or as a syringe pump.
    - Do not bundle PAM into the SP6500 filing in any narrative.
    - Do not present KOL digital twins as substitutes for live clinical review.

sections:
  - id: 1.1
    title: What SP6500 actually is
    anchor: L19-L23
    rhetorical_move: Definitional fence-setting — establishes what the device is and explicitly what it is not.
    primary_takeaway: SP6500 is a single-channel large-volume IV pump with a 7-inch touchscreen, a 5,000-entry drug library, and a benchtop 38% nuisance-alarm reduction; it is neither multi-channel nor a syringe pump, and 'closed-loop' refers only to internal flow control.
    key_facts:
      - 7" capacitive touchscreen
      - On-pump drug library up to 5,000 formulary entries
      - 38% nuisance-alarm reduction in benchtop testing vs SP6000 historical data
      - SP6500-MC and SP6500-S are separate variants, separately filed
      - Dose-error reduction software keeps prescriber-in-the-loop
    metaphor_candidates:
      - A precision scalpel, not a Swiss army knife
      - A guard rail at the edge of dosing, not a self-driving car
    contrast_pairs:
      - Single-channel vs multi-channel
      - Internal control loop vs clinician-out-of-the-loop
      - Marketing 'closed-loop' vs engineering reality
    callbacks: [1.2, 3.1]
    audience_alignment: Anchors steering committee and regulators on a shared, narrow definition before scope discussion.
    tone: precise, corrective
    warnings:
      - 38% number is benchtop only; do not generalize to clinical claim.
    data:
      kind: bar
      title: SP6500 alarm-fatigue improvement vs SP6000 baseline
      series:
        - { label: 'Nuisance-alarm reduction', value: 38, unit: '%', accent: 'orange' }
      baseline: 100
      annotation: Benchtop comparison against historical SP6000 alarm data.

  - id: 1.2
    title: Filing scope at a glance
    anchor: L25-L31
    rhetorical_move: Scope-fencing — declares what is in and what is deliberately out.
    primary_takeaway: One 510(k) covers SP6500 pump plus DLM with an integrated PCCP; PAM, CSS, and ATS are intentionally excluded to protect the timeline by an estimated 9 months.
    key_facts:
      - Single 510(k) for pump + firmware + Drug Library Manager
      - PAM is Class II SaMD accessory, separate 510(k) using SP6000-AlarmGuard K215555 as predicate
      - CSS and ATS are MDDS, fully out of scope
      - Only Ct*-tagged requirements are in 510(k) scope
      - PCCP covers formulary updates, firmware patches, and dose-error tuning
      - Predicate SP6000 K200111
      - Bundling PAM would add an estimated 9 months
    metaphor_candidates:
      - A surgical incision around the filing
      - A bulkhead protecting the timeline from scope creep
    contrast_pairs:
      - In-scope (pump + DLM) vs out-of-scope (PAM, CSS, ATS)
      - Ct* requirements vs commercial features
      - 510(k) deltas (PCCP + UX) vs predicate equivalence
    callbacks: [1.1, 1.3, 3.2]
    audience_alignment: Gives executives a clean mental model of what the submission actually contains.
    tone: declarative, disciplined
    warnings:
      - Do not soften the PAM carve-out — it is deliberate, not deferred.
    data:
      kind: comparison
      title: Filing scope inclusion versus exclusion
      series:
        - { label: 'SP6500 pump', value: 1, unit: 'in', accent: 'orange' }
        - { label: 'Drug Library Manager', value: 1, unit: 'in', accent: 'orange' }
