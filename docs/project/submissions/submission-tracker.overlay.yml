# Submission Tracker — Overlay Sidecar
#
# Single hand-managed sidecar that overlays per-row + per-(DHF, canonical_role)
# values onto the tracker. Persistent across `/tracker generate --write-canonical`
# regenerations because the sidecar is hand-authored and the generator/renderer
# only READ it (never write).
#
# Supersedes the previous split:
#   - submission-tracker.deliverable-names.yml  (per-DHF × role naming)  ← rolled in
#   - submission-tracker.human.json             (per-row status/ref)     ← rolled in
#
# Loaded by:
#   - `generate.py::load_overlay()`     — reads `defaults.by_dhf_role[<dhf>][<role>]`
#                                          when emitting row `name_token`
#   - `render.py::load_overlay()`       — reads `rows.<row_id>` to overlay
#                                          name / status / effort / ref / path
#                                          + carry owner/target_date/blockers/notes
#                                          into the row's detail panel
#
# Precedence — name:
#   1. rows.<row_id>.name                       — per-row override (highest)
#   2. defaults.by_dhf_role.<dhf>.<role>        — per-(DHF, role) default
#   3. folder.name / entry.name                 — generator's fallback
#
# Precedence — status / effort / ref / path:
#   1. rows.<row_id>.<field>                    — per-row override (highest)
#   2. generator's emitted value                 — derived from evidence walk
#                                                  (status defaults Not Started,
#                                                   effort defaults —,
#                                                   ref defaults —,
#                                                   path defaults to file link)

schema_version: "0.1"

# ─── Per-(DHF × canonical_role) defaults ─────────────────────────────────────
# Apply across every milestone that shares the (DHF, role) pair. Same SAD
# applies to Q-PC1 / PC1 / L1-PC1 / L2-PC1 by default; per-row overrides
# (below) take precedence.
defaults:

  by_dhf_role:

    pca-device:
      architecture:     "System Software Architecture Document (SAD)"
      plans:            "Design & Development Plan"
      user-needs:       "Use Specification (User Needs)"
      requirements:     "Design Input Specification (SRS)"
      vnv:              "Verification & Validation Protocol & Report"
      trace-matrix:     "Design Trace Matrix (UN ↔ DI ↔ Arch ↔ V&V)"
      tool-validation:  "Tool Validation Records"
      risk-management:  "Risk Management Report (ISO 14971)"
      clinical:         "Clinical Evaluation Report"
      postmarket:       "Periodic Safety Update Report (PSUR)"
      cybersecurity:    "Cybersecurity Vulnerability Management Plan"

    # Future: add connectivity-adapter / drug-library-manager entries here as
    # those DHFs come online. Use a "*" wildcard block for cross-DHF defaults
    # (e.g., if every DHF's "vnv" role gets the same friendly name).

# ─── Per-row overrides ────────────────────────────────────────────────────────
# Highest precedence. Override any cell value for a specific row. Carry
# metadata (owner / target_date / blockers / notes) into the row's detail
# panel without putting it in the canonical's cell display.
#
# Schema per row entry:
#   <row-id>:
#     name:        "..."          # overrides default name + folder.name
#     status:      Drafting       # overrides default Not Started
#     effort:      V.High         # overrides default —
#     ref:         "..."          # overrides default —
#     path:        "..."          # overrides generator-derived path link
#                                  # Set to disabled-button HTML to enable B6
#                                  # Create Draft button on the row.
#     owner:       <handle>       # metadata; surfaces in (i) panel
#     target_date: 2026-MM-DD     # metadata; surfaces in (i) panel
#     blockers:    [...]          # metadata; surfaces in (i) panel
#     notes:       "..."          # free text; surfaces in (i) panel

