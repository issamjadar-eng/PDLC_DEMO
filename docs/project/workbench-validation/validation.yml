  - id: WUN-06
    role: "Quality engineer"
    class: audit
    tier: T2
    need: "If our documentation drifts from its declared structure, traceability, or tracker baseline, I find out from our own audit run — not from an external auditor."
    coverage: tests
    implemented_by: "dhf-manifest coverage audit + trace-matrix graph checks + tracker validation + jira-pull drift rules"
  - id: WUN-07
    role: "Program lead"
    class: gates
    tier: T1
    need: "No project file gets changed without being anchored to a tracked task, so every change is traceable to why it was made."
    coverage: tests
    implemented_by: "task-gate PreToolUse hook (check-active-task.sh) with exempt-path list"
  - id: WUN-08
    role: "Quality engineer"
    class: gates
    tier: T1
    need: "Documents cannot be converted outside the controlled conversion pipeline without a deliberate, visible override."
    coverage: tests
    implemented_by: "docflow conversion-block PreToolUse hook with .state/docflow-active override marker"
  - id: WUN-09
    role: "DHF author"
    class: renderers
    tier: T1
    need: "Auto-generated sections of my documents always reflect the current source of truth, and never damage the text I wrote by hand around them."
    coverage: tests
    implemented_by: "sentinel-block renderer (render-sentinels.py) + advisor grounding renderer, both idempotent"
  - id: WUN-10
    role: "Program lead"
    class: console
    tier: T3
    need: "Dashboards and decks show me the real, current state of the project — and tell me when what I'm looking at is stale."
    coverage: tests
