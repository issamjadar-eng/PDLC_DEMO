dataset: commercial/openfda-maude-pca-monthly
title: MAUDE adverse-event COUNTS by received date, PCA pumps (openFDA device/event)
description: >-
  Real MAUDE event counts per received-date for PATIENT-CONTROLLED analgesia pumps —
  product code MEA ("Pump, Infusion, PCA", 21 CFR 880.5725), 2023-01 -> present, via
  openFDA's date-count API. The PCA-specific historical trend behind BQ-20's
  franchise-killer signal watch — daily buckets, aggregated to months by the analysis
  tier. Same epistemic constraints as the sibling FRN datasets: counts, never rates
  (no denominator — A-001 pattern), and reporting lag inflates apparent recent declines.
internal: false
max_age_days: 30
acquisition:
  type: openfda
  endpoint: /device/event.json
  search: 'device.device_report_product_code:MEA AND date_received:[20230101 TO 20301231]'
  count: date_received
  usage_rights: public-domain (openFDA — https://open.fda.gov/license/)
normalize:
  type: openfda-count
  output: records.csv
schema:
  file: records.csv
  key: [term]
  columns:
    - {name: term, type: str, required: true}
    - {name: count, type: int, required: true}
asserts:
  min_rows: 200
