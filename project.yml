# project.yml — Project manifest
#
# Single source of truth for project identity, team roster, and security policy.
# Skills and agents read this for project-specific context.
# This file is committed to the repo.
#
# Maintained by: medtech-docs init (creation), manual edits (ongoing)
# Consumed by: security-assert.sh, setup.sh, best-practices, task skill, secops agent

# ─── Project Identity ───

project:
  name: PDLC_DEMO
  repo: GlobalLogic-a-Hitachi-Company/PDLC_DEMO
  type: medtech
  regulatory_pathway: 510k
  device_class: II
  device_family: patient-controlled-analgesia-pump
  lead_product: PP3500 (PainEase PCA Advanced)
  portfolio_context:
    # Full 5-device infusion portfolio retained as predicate/portfolio reference
    # under docs/project/input-analysis/predicate-analysis/. PP3500 is the DHF anchor.
    - IP5000  # FlexFlow Pro — general-purpose IV pump (portfolio ref)
    - PP3000  # PainEase PCA — direct predicate to PP3500
    - PP3500  # PainEase PCA Advanced — LEAD PRODUCT (DHF anchor)
    - SP6000  # MicroDose Pro — syringe pump (portfolio ref)
    - SP6500  # MicroDose Elite — syringe pump (portfolio ref)
  composition:
    - samd      # Software as a Medical Device components
    - simd      # Software in a Medical Device (pump firmware)
    - hardware  # Custom medical electrical hardware
  capabilities:
    ai_ml: true
    ehr_integration: true     # HL7 FHIR
    medical_imaging: false
    surgical_navigation: false

# ─── DHFs ───
#
# Every project has at least one DHF. A DHF is a component with its own
# design controls, risk-management, clinical, postmarket, and cybersecurity
# folders. This section is the single source of truth for the project's DHF
# topology. Consumed by /medtech-docs, /strategy, /tracker, /best-practices.
#
# Added 2026-04-13 as part of task 007 P6 (unified DHF shape reorg).
# PDLC_DEMO starts with one DHF (pca-device, the PP3500 DHF anchor); other
# components (connectivity-adapter, cloud-suite + 7 child apps) will be added
# via /medtech-docs add-dhf as they are scoped.
#
# Fields:
#   path       — required; folder name under docs/project/dhfs/ (or nested path)
#   regulatory — concept | in-development | cleared | mixed
#   filing     — submission folder this DHF rolls up into (null if not scoped)
#   parent     — parent DHF path (null for top-level)

dhfs:
  # Top-level DHFs
  - path: pca-device
    regulatory: in-development
    filing: 510k
    parent: null
  - path: connectivity-adapter
    regulatory: in-development
    filing: 510k
    parent: null

  # Platform DHF (children carry the regulatory weight)
  - path: cloud-suite
    regulatory: mixed
    filing: null
    parent: null

  # cloud-suite child DHFs (all nested under cloud-suite/dhfs/)
  - path: cloud-suite/dhfs/drug-library-manager
    regulatory: in-development
    filing: 510k
    parent: cloud-suite
  - path: cloud-suite/dhfs/fleet-management
    regulatory: in-development
    filing: 510k
    parent: cloud-suite
  - path: cloud-suite/dhfs/compliance-reports
    regulatory: in-development
    filing: 510k
    parent: cloud-suite
  - path: cloud-suite/dhfs/analytics-dashboard
    regulatory: in-development
    filing: 510k
    parent: cloud-suite
  - path: cloud-suite/dhfs/inventory-tracker
    regulatory: in-development
    filing: 510k
    parent: cloud-suite
  - path: cloud-suite/dhfs/alerts-engine
    regulatory: in-development
    filing: 510k
    parent: cloud-suite
  - path: cloud-suite/dhfs/clinical-interface
    regulatory: in-development
    filing: 510k
    parent: cloud-suite

# ─── Team Roster ───
#
# Every repo collaborator must have a row here.
# task_folder is the lowercase name used under tasks/{folder}/
# GitHub username must be exact (case-sensitive) for API matching.

team:
  active:
    - name: Ben Xavier
      github: benxavier-gl
      task_folder: ben
      role: Demo Owner
      email: ben.xavier@globallogic.com
      added: 2026-04-12
  inactive: []

# ─── Skill Registries ───
#
# Approved sources for skills, agents, and templates.
# Skills/agents not traceable to an approved registry trigger secops warnings.

registries:
  - name: anthropic
    type: builtin
    description: Anthropic official skills (docx, pptx, xlsx, pdf)
    skills:
      - docx
      - pptx
      - xlsx
      - pdf

  - name: hitachi
    type: github
    repo: GlobalLogic-a-Hitachi-Company/hitachi
    path: skills/manifest.md
    local_path: ../hitachi    # local working checkout used by /sync-skills (relative to project root)
    description: Internal shared registry — project skills and best practices
    skills:
      - best-practices
      - docflow
      - lessons
      - medtech-docs
      - skill-creator
      - strategy
      - sync-skills
      - task
      - tracker

# ─── Security Policy ───

security:
  approved_email_domains:
    - globallogic.com
    - method.com

  check_ttl_days: 7
  attestation_ttl_days: 30

  required_gitignore_patterns:
    - ".env"
    - "*.pem"
    - "*.key"
    - "*.p12"
    - "credentials*"
    - "**/PHI/**"
    - "**/patient*data*"

  # Auto-populated from registries.skills lists (union, alphabetized).
  # When a new skill is added to a registry entry above, also add it here
  # so the secops audit can verify the installed set matches the approved set.
  approved_skills:
    - advisors
    - best-practices
    - change-control
    - docflow
    - docx
    - lessons
    - medtech-docs
    - pdf
    - pptx
    - project-console
    - secops
    - skill-creator
    - strategy
    - sync-skills
    - task
    - trace-matrix
    - tracker
    - xlsx
  approved_mcps:
    # chrome-devtools — Google's Chrome DevTools MCP server. Lets Claude
    # drive a real Chrome instance for visual validation: navigate, take
    # screenshots, inspect computed styles, evaluate JS in the page. Used
    # during project-console frontend work (task 003) to verify layouts
    # that can't be checked from source alone.
    # Install: `claude mcp add chrome-devtools -- npx -y chrome-devtools-mcp@latest`
    - chrome-devtools
  approved_plugins: []
  approved_agents:
    - project-secops

# Advisors — persona subagents installed by /advisors init.
# `enabled` curates which advisors are exposed to CC and the console.
# `overlays.<name>.add` adds project-specific globs on top of the agent's
# baseline (universal + shape-stable) sources. `overlays.<name>.exclude`
# filters paths out of the resolved file list. Tier-3 entries start empty.
advisors:
  enabled:
    - regulatory-affairs
    - clinical-affairs
    - risk-management
  overlays:
    regulatory-affairs:
      add: []
      exclude: []
    clinical-affairs:
      add: []
      exclude: []
    risk-management:
      add: []
      exclude: []
