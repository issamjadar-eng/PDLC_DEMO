# ─── file-locator MCP ──────────────────────────────────────────────────────
# Semantic file-locator over project docs + curated medtech-functional skill
# content. Returns ranked (path, summary, heading_anchor?, score) tuples for
# natural-language queries. Index lives at `tools/file-locator-mcp/index.db`
# and is COMMITTED (one canonical artifact for the team; CI-owned rebuild on
# PR merge keeps it fresh).
#
# Edit `corpus_includes` to add project-specific paths; do not replace the
# defaults — the curated 8-skill registry below is intentional.
# ───────────────────────────────────────────────────────────────────────────
file_locator:
  index_path: tools/file-locator-mcp/index.db
  embedding:
    provider: local                       # only valid value in v1
    model: BAAI/bge-small-en-v1.5
    dimension: 384
  ranking:
    embedding_weight: 0.6
    bm25_weight: 0.4
    banding:
      high_confidence: 0.70
      partial_match: 0.40
  granularity:
    sub_summary_when_lines_gt: 500
    sub_summary_when_h2_gt: 5
    decision_block_pattern: '^#{2,3}\s+DECISION'
  corpus_includes:
    # Project-root narrative (universal across medtech-docs projects)
    - "*.md"
    - "project.yml"
    # Project documentation tree (initialized by /medtech-docs init)
    - "docs/**/*.md"
    # Curated 8-skill registry — registry-distributed medtech-functional knowledge
    - ".claude/skills/dhf-manifest/**/*.md"
    - ".claude/skills/dhf-manifest/**/*.yml"
    - ".claude/skills/medtech-docs/**/*.md"
    - ".claude/skills/trace-matrix/**/*.md"
    - ".claude/skills/change-control/**/*.md"
    - ".claude/skills/tracker/**/*.md"
    - ".claude/skills/secops/**/*.md"
    - ".claude/skills/jira-pull/**/*.md"
    - ".claude/skills/docflow/**/*.md"
  corpus_excludes:
    # Universal artifacts
    - "**/_scratch/**"
    - "**/_work/**"                # personal committed task-sandbox — never a grounding source
    - "**/_usage-metrics/**"   # per-person committed usage data (machine-generated, non-canonical)
    - "**/.staging/**"
    - "**/.worktrees/**"
    - "**/node_modules/**"
    - "**/__pycache__/**"
    - "**/.git/**"
    - "**/*.lock"
    - "**/assets/**"
    - "**/formal/**"               # docflow-controlled drafts
    - "**/Icon"                    # macOS Finder 0-byte artifact
    - "**/index.db"
    # Owned by other registry skills — universal if those skills are installed
    - "docs/.change-control/**"    # change-control snapshot state cache
    - "docs/confluence-staging/**" # change-control pre-canonical staging
    - "articles/**"                # medtech-docs new-article tree — external-consumption articles, never canonical (v34)

# ---------------------------------------------------------------------------
# usage_metrics — cross-user Claude Code token-usage telemetry (skill: usage-metrics)
# ---------------------------------------------------------------------------
# git-as-aggregator: each teammate collects LOCALLY into their own task folder
# (tasks/{task_folder}/_usage-metrics/), commits it, and git/GitHub is the
# transport that converges everyone's data. A script rolls it up — no shared
# server, no LLM in the data path. Identity = the task_folder (the folder IS the
# person), so no email/PII is written into committed records.
usage_metrics:
  method: local                  # local (git-as-aggregator, supported) | admin_api (future stub)
  identity: task_folder          # the per-person folder IS the identity (reuses team.active[].task_folder)
  source: transcript             # transcript (CC local session jsonl) | otel-local (alt, not built)
  storage:
    per_user_dir: tasks/{task_folder}/_usage-metrics   # committed; {task_folder} from team.active[]
    layout: per-session          # YYYY-MM/<session_id>.json — collision-free across sessions/machines
    dedup_key: message.id        # transcript rows duplicate ~2x; dedupe before summing
  aggregate:
    transport: git               # git/GitHub is the bus — no shared collector/server
    output_dir: tools/usage-metrics   # team dashboard (index.html + usage.json), anonymized
    anonymize: true              # team view shows "Member N" labels — no real names
  refresh:
    trigger: session-start       # auto-refresh via the usage-metrics-refresh.sh SessionStart hook
    refresh_ttl_days: 7          # regenerate only if the local dashboard is older than this
    scope: local                 # local (no git pull/commit/network) | pull | full-sync (see hook)
  publish:
    enabled: true                # SessionEnd: push your OWN _usage-metrics/ data to `branch`
    branch: main                 #   via an isolated worktree (working branch untouched). This is
                                 #   what feeds the daily-aggregate GitHub workflow. false to disable.
