- leaf: connectivity-adapter
  path: docs/project/dhfs/connectivity-adapter
  role: item
  # MDDS (21 CFR 880.6310) — Class I exempt from 510(k) premarket, still under
  # 21 CFR 820.30 design controls. Tracker-scope trim: architecture / plans /
  # requirements / vnv / trace-matrix / risk-management / cybersecurity. Skipped:
  # user-needs (no clinical UI), tool-validation (no Class-C tooling), clinical
  # (no clinical claims), postmarket (rolled into parent-system PSUR).
  architecture_name: Adapter
  classification:
    samd: true
    class: I
    iec62304: B
    ai_enabled: false
    mdds: true
  regulatory: in-development
  filing: 510k
  parent: null
- leaf: cloud-suite
  path: docs/project/dhfs/cloud-suite
  role: system
  # Non-medical, but PCA + connectivity-adapter depend on cloud-suite for
  # architecture context, SBOM, storage, and OTA/device-management. Tracker-scope
  # trim: architecture / plans / requirements / vnv / trace-matrix /
  # risk-management / cybersecurity (covers the dependency contract). Skipped:
  # user-needs, tool-validation, clinical, postmarket (non-medical scope).
  architecture_name: Cloud
  composes:
  - drug-library-manager
