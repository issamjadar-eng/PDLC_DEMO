# ─── Tracker skill — project-local config ───
# Consumed by `/tracker generate` and `/tracker render` for per-project tuning.
# All fields optional; skill ships sensible defaults.
tracker:
  display:
    # Map milestone IDs to the Phase column short labels. Workaround for the
    # upstream generate.py bug where ENG rows pass milestone_id as both args
    # to _phase_for_milestone(), so without this override ENG rows render
    # "pccp-release" / "lmr2-release" instead of "510k+PCCP" / "LMR2".
    # Deliverable rows derive the same label from milestone.name (stripped),
    # so this override also keeps both code paths aligned.
    phase_label_overrides:
      qsub-release: QSub
      pccp-release: 510k+PCCP
      lmr1-release: LMR1
      lmr2-release: LMR2
  # Explicit DHF prefix map — keeps generated row IDs readable as the DHF set
  # grows. Without this map, generate.py:dhf_prefix() falls back to first-two-
  # letters-of-leaf which gives "CO" / "CL" (ambiguous on cloud-* siblings).
  row_id_schema:
    dhf_prefix_map:
      pca-device:           PC
      connectivity-adapter: CA
      cloud-suite:          CS

