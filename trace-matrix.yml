# Trace matrix per-DHF source map.
# Generated for PDLC_DEMO. Edit by hand or run `/trace-matrix init` to refresh.
#
# Each DHF entry maps the five trace layers (user_needs, design_inputs,
# architecture, vnv, risk) onto concrete source files in the repo. The
# trace-matrix skill reads this file at build time.

version: 1

dhfs:
  - name: pca-device
    layers:
      user_needs:
        source: docs/project/dhfs/pca-device/design-controls/user-needs/user-needs.md
        id_prefix: UN
      design_inputs:
        source: docs/project/dhfs/pca-device/design-controls/requirements/design-inputs.md
        id_prefix: DI
      architecture:
        source: docs/project/dhfs/pca-device/design-controls/architecture/pca-device-system-sad.md
        id_prefix: M
      vnv:
        # v1: V&V nodes are derived from the DI document's Verification Method
        # column. When a real verification protocols doc lands, point `source`
        # at it and the parser will switch.
        source: null
        id_prefix: VER
    risk:
      source: docs/project/dhfs/pca-device/risk-management/risk-strategy.md
      id_prefix: HZ
    output_dir: docs/project/dhfs/pca-device/design-controls/trace-matrix
